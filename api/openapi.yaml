          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudienceConfig'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/products/{product_id}/audience-configs/{audience_config_id}:
    get:
      operationId: getAudienceConfig
      summary: Read an audience configuration of a product
      description: >-
        Returns an audience configuration in force to whoever may read the
        product: a platform administrator, and whoever holds something in
        force in it. To anyone else there is no such product (404
        PRODUCT_NOT_FOUND). A configuration that was removed is not found
        (404 AUDIENCE_CONFIG_NOT_FOUND), and a configuration of another
        product is not found under this one. The ETag of the answer is what
        a change of the configuration is made from.
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/AudienceConfigId'
      responses:
        '200':
          description: The audience configuration
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              description: A product is private to its members
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudienceConfig'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: changeAudienceConfig
      summary: Change where an audience enters the documentation
      description: >-
        Replaces what can change of the configuration with the body: where
        the audience enters the documentation of the environment. A body
        without docs_url says that there is no entry. The audience and the
        environment of a configuration never change: another pair is another
        configuration.


        A change is made from the configuration as the caller read it: the
        request sends back in If-Match the ETag it was answered with. One
        without If-Match is refused (428 PRECONDITION_REQUIRED). If the
        configuration changed since it was read, the change is refused (412
        PRECONDITION_FAILED), and the caller reads it again and decides anew:
        of two changes made from one version, one is made. A change to the
        entry the configuration has already changes nothing, and its version
        stays.


        Only an owner of the product may change a configuration. Whoever else
        may know the product exists is refused (403 FORBIDDEN), whatever the
        request names; to anyone else there is no such product (404
        PRODUCT_NOT_FOUND). A configuration that is not in force is not found
        (404 AUDIENCE_CONFIG_NOT_FOUND), and a suspended product takes no
        change (409 PRODUCT_NOT_ACTIVE).


        The change, the audit record and the event are committed together or
        not at all. A 503 OUTCOME_UNCERTAIN means it is not known which: read
        before retrying.
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/AudienceConfigId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AudienceConfigChange'
      responses:
        '200':
          description: The audience configuration as it is now
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              description: A product is private to its members
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudienceConfig'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: removeAudienceConfig
      summary: Remove an audience configuration of a product
      description: >-
        Ends the configuration: from the moment the removal is committed the
        product documents nothing for the audience in the environment, until
        the pair is configured again, as a new configuration. Only an owner
        of the product may, also of a product that is suspended. Whoever else
        may know the product exists is refused (403 FORBIDDEN); to anyone
        else there is no such product (404 PRODUCT_NOT_FOUND). A
        configuration that is not in force is not found (404
        AUDIENCE_CONFIG_NOT_FOUND), whoever removed it, so a removal that is
        sent again is answered so. The configuration is kept as a record,
        with who removed it and when.


        The removal, the audit record and the event are committed together
        or not at all. A 503 OUTCOME_UNCERTAIN means it is not known which:
        read before retrying.
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/AudienceConfigId'
      responses:
        '204':
          description: The audience configuration was removed
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
