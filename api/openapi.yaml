      description: >-
        A product owner or a current author, reviewer or publisher of the
        asset's workspace can read its revision history, oldest capture first. The cursor belongs to
        this product and asset and conveys no authorization. Results include
        source and closure digests and omit the original source bytes.
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - name: api_asset_id
          in: path
          required: true
