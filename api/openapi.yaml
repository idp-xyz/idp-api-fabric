              schema:
                $ref: '#/components/schemas/ContractRevisionList'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: importRevision
      summary: Import an OpenAPI source bundle as a draft revision
      description: >-
        A current internal author of the HTTP asset's owning workspace can
        import into an active product. Submit UTF-8 YAML or JSON files as
        standard Base64, with a canonical relative entrypoint. The bundle
        holds up to 16 files and 40960 decoded bytes, within the 65536-byte
        HTTP request limit. Capture supports an OpenAPI 3.1.2 entrypoint and
        relative JSON Pointer references within the bundle. It refuses
        remote references, paths outside the bundle and cycles. The original
        entrypoint and referenced files are preserved with SHA-256 digests.
        Inaccessible assets are hidden using the API Catalog read rules.
        A source may name the Git commit its files were read at
        (git_origin). The entrypoint and the file paths are then the paths
        of the files in the repository. Fabric records the origin as it is
        declared, with who declared it, and does not read the repository. A
        source without an origin is an upload.
        A closure is recorded once per source: the uploads of an asset are
        one source and each repository is another. A new closure creates a
        DRAFT revision with a monotonically increasing sequence and returns
        201. A closure already recorded from the same source returns 200
        with the revision recorded first, under the origin it was recorded
        with, also when it is submitted again from a later commit. An
        entrypoint of a commit is recorded with one closure: the same
        repository, commit and entrypoint with another closure is refused
        (409 GIT_ORIGIN_CONFLICT), because a commit never changes. The
        source snapshot, revision, success audit and Outbox event commit
        together.
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - name: api_asset_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Identifier'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractSourceUpload'
      responses:
        '201':
          description: A draft revision was created
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri-reference
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractRevision'
        '200':
          description: The source closure was already registered for this asset from the same source
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractRevision'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
