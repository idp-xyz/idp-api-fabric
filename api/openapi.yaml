openapi: 3.1.2
info:
  title: IDP API Fabric management API
  version: 0.3.0
  description: >-
    The HTTP contract of the Fabric control plane. The DTOs and the handler
    interface in internal/transport/http are generated from this document, and
    every request is validated against it before an operation runs, so an
    operation is served only as it is declared here.


    Every error is an RFC 9457 problem. Callers branch on its error_code,
    never on its title or detail.
# An operation needs a verified caller unless it says otherwise. A new
# operation is therefore private until its declaration makes it public.
security:
  - bearerToken: []
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Report liveness
      description: >-
        Answers as long as the process serves HTTP. It reads no dependency, so
        it says nothing about the database.
      security: []
      responses:
        '200':
          description: The process is serving
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        default:
          $ref: '#/components/responses/Problem'
  /version:
    get:
      operationId: getVersion
      summary: Report the build identity
      security: []
      responses:
        '200':
          description: The build this process runs
          headers:
            Cache-Control:
              description: The identity changes with every deployment
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildInfo'
        default:
          $ref: '#/components/responses/Problem'
  /v1/products:
    post:
      operationId: registerProduct
      summary: Register a product
      description: >-
        Registers an independent product and makes its first owners. Only a
        platform administrator may (403 FORBIDDEN otherwise). A product key
        that is taken is refused (409 PRODUCT_KEY_TAKEN), and so is an owner
        under an issuer this deployment does not trust (422
        OWNER_ISSUER_NOT_TRUSTED).


        The product, the role of its owners, the audit record and the event
        are committed together or not at all. A 503 OUTCOME_UNCERTAIN means it
        is not known which: read before retrying.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRegistration'
      responses:
        '201':
          description: The product was registered
          headers:
            Location:
              description: Where the product is read
              required: true
              schema:
                type: string
                format: uri-reference
            Cache-Control:
              description: A product is private to its members
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/products/{product_id}:
    get:
      operationId: getProduct
      summary: Read a product
      description: >-
        Returns the product to a platform administrator and to whoever holds a
        role in it. To anyone else the product does not exist: the answer is
        404 PRODUCT_NOT_FOUND, the same as for a product that is missing.
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: The product
          headers:
            Cache-Control:
              description: A product is private to its members
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/products/{product_id}/workspaces:
    post:
      operationId: createWorkspace
      summary: Create a workspace of a product
      description: >-
        Gives the product a workspace. Only an owner of that product may.
        Whoever may know the product exists and does not own it is refused
        (403 FORBIDDEN); to anyone else there is no such product (404
        PRODUCT_NOT_FOUND). A workspace key the product has already is refused
        (409 WORKSPACE_KEY_TAKEN), and so is a product that is suspended (409
        PRODUCT_NOT_ACTIVE).


        The workspace, the audit record and the event are committed together
        or not at all. A 503 OUTCOME_UNCERTAIN means it is not known which:
        read before retrying.
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceCreation'
      responses:
        '201':
          description: The workspace was created
          headers:
            Location:
              description: Where the workspace is read
              required: true
              schema:
                type: string
                format: uri-reference
            Cache-Control:
              description: A workspace is private to the members of its product
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/products/{product_id}/workspaces/{workspace_id}:
    get:
      operationId: getWorkspace
      summary: Read a workspace of a product
      description: >-
        Returns the workspace to whoever holds a role in its product. To a
        stranger the product does not exist (404 PRODUCT_NOT_FOUND). A
        platform administrator knows the product exists and nothing of what
        is inside it (404 WORKSPACE_NOT_FOUND). A workspace of another product
        is not found under this one.
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: The workspace
          headers:
            Cache-Control:
              description: A workspace is private to the members of its product
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/products/{product_id}/workspaces/{workspace_id}/memberships:
    post:
      operationId: grantMembership
      summary: Make a principal a member of a workspace
      description: >-
        Makes the principal hold the role in the workspace, from now until the
        membership is revoked. Only an owner of the product may. Whoever may
        know the product exists and does not own it is refused (403
        FORBIDDEN); to anyone else there is no such product (404
        PRODUCT_NOT_FOUND). Neither answer says anything about the workspace.
        A workspace the product does not have is not found (404
        WORKSPACE_NOT_FOUND). A role the principal holds in the workspace
        already is refused (409 MEMBERSHIP_EXISTS), and so are a product that
        is suspended (409 PRODUCT_NOT_ACTIVE) and a member under an issuer
        this deployment does not trust (422 MEMBER_ISSUER_NOT_TRUSTED).


        The membership, the audit record and the event are committed together
        or not at all. A 503 OUTCOME_UNCERTAIN means it is not known which:
        read before retrying.
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipGrant'
      responses:
        '201':
          description: The principal is a member of the workspace
          headers:
            Location:
              description: Where the membership is read and revoked
              required: true
              schema:
                type: string
                format: uri-reference
            Cache-Control:
              description: A membership is private to the owners of its product
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/products/{product_id}/workspaces/{workspace_id}/memberships/{membership_id}:
    get:
      operationId: getMembership
      summary: Read a membership of a workspace
      description: >-
        Returns a membership in force to an owner of the product. Nobody else
        reads one, its member included, and each is answered as far as it may
        know: a stranger is told there is no such product (404
        PRODUCT_NOT_FOUND), whoever knows the product and may not read the
        workspace that there is no such workspace (404 WORKSPACE_NOT_FOUND),
        and a member of the workspace that there is no such membership (404
        MEMBERSHIP_NOT_FOUND). A membership that was revoked grants nothing
        and is not found either.
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/MembershipId'
      responses:
        '200':
          description: The membership
          headers:
            Cache-Control:
              description: A membership is private to the owners of its product
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: revokeMembership
      summary: Revoke a membership of a workspace
      description: >-
        Ends the membership: from the moment the revocation is committed it
        grants nothing. Only an owner of the product may, and whoever does not
        own it is answered as for a grant. A membership that is not in force
        is not found (404 MEMBERSHIP_NOT_FOUND), whoever ended it, so a
        revocation that is sent again is answered so. The membership is kept
        as a record, with who revoked it and when, and the role can be granted
        again as a new membership.


        The revocation, the audit record and the event are committed together
        or not at all. A 503 OUTCOME_UNCERTAIN means it is not known which:
        read before retrying.
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/MembershipId'
      responses:
        '204':
          description: The membership was revoked
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        An access token of the identity provider this deployment trusts,
        addressed to this deployment. Fabric verifies tokens and never issues
        them. A token says who the caller is; what the caller may do is
        decided from the roles the server holds, so no scope is declared.
  parameters:
    ProductId:
      name: product_id
      in: path
      required: true
      description: The identifier of the product
      schema:
        $ref: '#/components/schemas/Identifier'
    WorkspaceId:
      name: workspace_id
      in: path
      required: true
      description: The identifier of the workspace
      schema:
        $ref: '#/components/schemas/Identifier'
    MembershipId:
      name: membership_id
      in: path
      required: true
      description: The identifier of the membership
      schema:
        $ref: '#/components/schemas/Identifier'
  responses:
    Problem:
      description: RFC 9457 problem with a stable error code
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthenticated:
      description: >-
        The request carries no credentials (CREDENTIALS_MISSING) or a token
        that is not accepted (TOKEN_INVALID). Why a token is not accepted is
        not said.
      headers:
        WWW-Authenticate:
          description: The Bearer challenge of RFC 6750
          required: true
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    BuildInfo:
      type: object
      required: [version, commit, built_at]
      properties:
        version:
          type: string
        commit:
          type: string
        built_at:
          type: string
    Identifier:
      description: >-
        The stable identity of an object: a UUID in its canonical form. It is
        never reused and says nothing about the object.
      type: string
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    Key:
      description: >-
        The name people and configuration use for an object, unique in its
        scope: 2 to 63 lower case letters, digits and hyphens, starting with a
        letter and not ending with a hyphen. It is not the identity of the
        object.
      type: string
      pattern: '^[a-z][a-z0-9-]{0,61}[a-z0-9]$'
    DisplayName:
      description: >-
        The name an object is shown under: 1 to 120 characters, without
        control characters and without surrounding white space. It identifies
        nothing and is not unique.
      type: string
      minLength: 1
      maxLength: 120
      pattern: '^[^\p{Z}\p{Cc}]([^\p{Cc}]*[^\p{Z}\p{Cc}])?$'
    Reference:
      description: >-
        A reference into another system, compared for equality and never
        interpreted: 1 to 255 characters, without control characters.
      type: string
      minLength: 1
      maxLength: 255
      pattern: '^[^\p{Cc}]+$'
    Principal:
      description: >-
        A user, a service account or a workload: a subject as one issuer
        names it. The same subject under another issuer is another principal.
      type: object
      additionalProperties: false
      required: [issuer, subject]
      properties:
        issuer:
          $ref: '#/components/schemas/Reference'
        subject:
          $ref: '#/components/schemas/Reference'
    OrganizationRef:
      description: >-
        A reference to the organization a product belongs to, in the identity
        or organization system that knows it. It is recorded as it is given;
        no permission is derived from it.
      type: object
      additionalProperties: false
      required: [identity_provider, organization]
      properties:
        identity_provider:
          $ref: '#/components/schemas/Reference'
        organization:
          $ref: '#/components/schemas/Reference'
    ProductRegistration:
      type: object
      additionalProperties: false
      required: [product_key, display_name, owner_organization, owners]
      properties:
        product_key:
          description: Unique among all products
          $ref: '#/components/schemas/Key'
        display_name:
          $ref: '#/components/schemas/DisplayName'
        owner_organization:
          $ref: '#/components/schemas/OrganizationRef'
        owners:
          description: >-
            The principals that own the product from the start. An owner
            manages the workspaces of the product. Each is named under an
            issuer this deployment trusts.
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Principal'
    Product:
      type: object
      required: [product_id, product_key, display_name, status, owner_organization, created_at]
      properties:
        product_id:
          $ref: '#/components/schemas/Identifier'
        product_key:
          $ref: '#/components/schemas/Key'
        display_name:
          $ref: '#/components/schemas/DisplayName'
        status:
          description: A suspended product takes no new work; what it holds is kept
          type: string
          enum: [ACTIVE, SUSPENDED]
        owner_organization:
          $ref: '#/components/schemas/OrganizationRef'
        created_at:
          type: string
          format: date-time
    WorkspaceCreation:
      type: object
      additionalProperties: false
      required: [workspace_key, display_name]
      properties:
        workspace_key:
          description: Unique among the workspaces of the product
          $ref: '#/components/schemas/Key'
        display_name:
          $ref: '#/components/schemas/DisplayName'
    Workspace:
      type: object
      required: [workspace_id, product_id, workspace_key, display_name, status, created_at]
      properties:
        workspace_id:
          $ref: '#/components/schemas/Identifier'
        product_id:
          description: The product the workspace belongs to, for good
          $ref: '#/components/schemas/Identifier'
        workspace_key:
          $ref: '#/components/schemas/Key'
        display_name:
          $ref: '#/components/schemas/DisplayName'
        status:
          type: string
          enum: [ACTIVE]
        created_at:
          type: string
          format: date-time
    WorkspaceRole:
      description: >-
        What a member is in a workspace. A workspace_maintainer creates and
        updates the API assets of the workspace; an internal_author writes and
        reads its contract revisions. Neither manages the workspace or its
        members, which is for the owners of the product, and neither says
        anything about another workspace.
      type: string
      enum: [workspace_maintainer, internal_author]
    MembershipGrant:
      type: object
      additionalProperties: false
      required: [member, role]
      properties:
        member:
          $ref: '#/components/schemas/Principal'
        role:
          $ref: '#/components/schemas/WorkspaceRole'
    Membership:
      description: >-
        A principal that holds a role in one workspace. It is in force from
        granted_at until it is revoked; a revoked membership is not shown.
      type: object
      required: [membership_id, product_id, workspace_id, member, role, granted_at]
      properties:
        membership_id:
          $ref: '#/components/schemas/Identifier'
        product_id:
          description: The product the workspace belongs to
          $ref: '#/components/schemas/Identifier'
        workspace_id:
          $ref: '#/components/schemas/Identifier'
        member:
          $ref: '#/components/schemas/Principal'
        role:
          $ref: '#/components/schemas/WorkspaceRole'
        granted_at:
          type: string
          format: date-time
    Problem:
      description: >-
        The error body of every operation. Callers branch on error_code, never
        on title or detail.
      type: object
      required: [type, title, status, error_code]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        error_code:
          type: string
        trace_id:
          description: Ties the problem to the log lines and the audit record of the request
          type: string
