openapi: 3.1.2
info:
  title: IDP API Fabric management API
  version: 0.34.0
  description: >-
    The HTTP contract of the Fabric control plane. The DTOs and the handler
    interface in internal/transport/http are generated from this document, and
    every request is validated against it before an operation runs, so an
    operation is served only as it is declared here.


    Every error is an RFC 9457 problem. Callers branch on its error_code,
    never on its title or detail.


    A list is read a page at a time, in a fixed order. Publication and block
    history use generations. The audit records of a product are newest first,
    by the instant they were recorded, then by identifier. Other lists are oldest first, by the instant an
    item was created or granted, then by identifier. An item keeps its place for as
    long as it is listed. A page holds at most 100 items and says where the
    next one starts. It starts behind a position, not at an offset: an offset
    shifts whenever an item before it is added or ends, which repeats or skips
    items, and it costs more the further into the list it is. Each page is
    read from what is there when it is read. What was in the list before the
    first page was read and is still in it after the last is returned exactly
    once; what is added, or ends, in between may or may not be returned. No
    list says how many items it has: that would say how much there is that the
    caller may not read.
# An operation needs a verified caller unless it says otherwise. A new
# operation is therefore private until its declaration makes it public.
security:
  - bearerToken: []
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Report liveness
      description: >-
        Answers as long as the process serves HTTP. It reads no dependency, so
        it says nothing about the database.
      security: []
      responses:
        '200':
          description: The process is serving
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        default:
          $ref: '#/components/responses/Problem'
  /version:
    get:
      operationId: getVersion
      summary: Report the build identity
      security: []
      responses:
        '200':
          description: The build this process runs
          headers:
            Cache-Control:
              description: The identity changes with every deployment
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildInfo'
        default:
          $ref: '#/components/responses/Problem'
  /v1/caller:
    get:
      operationId: getCaller
      summary: Read who the caller is
      description: >-
        Returns the principal the token of the request is about, an issuer and
        a subject, and whether the deployment names it an administrator of the
        platform. It is about the caller and nobody else: the operation takes
        no parameter, and a request that sends a query parameter or a body is
        refused (400 REQUEST_INVALID), as any request is that sends what its
        operation does not declare. The token says nothing else that is passed
        on, so there is no name to show.


        Being an administrator of the platform holds nothing in any product:
        what a principal holds in a product is read with getCallerInProduct.
        Nothing is recorded, and nobody is refused here but a caller that is
        not authenticated, which is answered before the operation runs.
      responses:
        '200':
          description: Who the caller is
          headers:
            Cache-Control:
              description: What a caller is told of itself is private to it
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Caller'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/products:
    get:
      operationId: listProducts
      summary: List the products
      description: >-
        Returns the products the caller may read, those getProduct returns to
        it: every product to a platform administrator, and to anybody else
        the products it holds something in force in, a role in the product or
        a membership in one of its workspaces. Whoever holds nothing gets an
        empty list, and nobody is refused.
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageToken'
      responses:
        '200':
          description: A page of the products
          headers:
            Cache-Control:
              description: A product is private to its members
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductList'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: registerProduct
      summary: Register a product
      description: >-
        Registers an independent product and makes its first owners. Only a
        platform administrator may (403 FORBIDDEN otherwise). A product key
        that is taken is refused (409 PRODUCT_KEY_TAKEN), and so is an owner
        under an issuer this deployment does not trust (422
        OWNER_ISSUER_NOT_TRUSTED). The product presents itself under its
        display name until an owner changes its brand.


        The product, the role of its owners, the audit record and the event
        are committed together or not at all. A 503 OUTCOME_UNCERTAIN means it
        is not known which: read before retrying.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRegistration'
      responses:
        '201':
          description: The product was registered
          headers:
            Location:
              description: Where the product is read
              required: true
              schema:
                type: string
                format: uri-reference
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              description: A product is private to its members
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/products/{product_id}:
    get:
      operationId: getProduct
      summary: Read a product
      description: >-
        Returns the product to a platform administrator and to whoever holds
        something in force in it: a role in the product, or a membership in
        one of its workspaces. To anyone else the product does not exist: the
        answer is 404 PRODUCT_NOT_FOUND, the same as for a product that is
        missing. That includes whoever held something in it that was revoked
        since. The product is shown with its brand, and the ETag of the
        answer is what a change of the product is made from.
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: The product
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              description: A product is private to its members
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/products/{product_id}/caller:
    get:
      operationId: getCallerInProduct
      summary: Read what the caller holds in a product
      description: >-
        Returns what the caller holds in the product now: the roles of the
        product it holds, and the workspaces of the product it is a member of,
        with its roles in each. It is about the caller and nobody else: the
        only parameter is the product. Every request reads what is in force
        when it is made, so a role or a membership that was revoked is not in
        the answer from the moment the revocation is committed, under the very
        token that was used before.


        It says what the caller holds and nothing of what that lets it do.
        Owning the product is holding product_owner, and an owner reads every
        workspace of the product without being a member of any (listWorkspaces),
        so workspaces lists the memberships the caller holds, not the
        workspaces it may read. It is not a page of a list and has no
        next_page_token: it has one item for each workspace the caller is a
        member of, all of them.


        It is answered to whoever getProduct answers: a platform administrator
        and whoever holds something in force in the product, a role in it or a
        membership of one of its workspaces. An administrator that holds
        nothing in it is told so, with two empty lists. To anyone else the
        product does not exist: the answer is 404 PRODUCT_NOT_FOUND, the same
        as for a product that is missing, and that includes whoever held
        something in it that was revoked since. A suspended product still
        tells what is held in it.
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: What the caller holds in the product
          headers:
            Cache-Control:
              description: What a caller is told of itself is private to it
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallerInProduct'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/products/{product_id}/brand:
    put:
      operationId: changeProductBrand
      summary: Change the brand of a product
      description: >-
        Replaces the brand of the product with the body: the name the product
        presents itself under to the developers it documents its APIs for,
        where its logo is fetched from, and its colour. The brand is replaced
        as a whole: a body without logo_url says that the product has no
        logo, and one without primary_color that it has no colour. A product
        has a brand from its registration, under its display name.


        A change is made from the product as the caller read it: the request
        sends back in If-Match the ETag getProduct answered with. One without
        If-Match is refused (428 PRECONDITION_REQUIRED). If the product
        changed since it was read, the change is refused (412
        PRECONDITION_FAILED), and the caller reads it again and decides anew:
        of two changes made from one version, one is made. A change to the
        brand the product has already changes nothing, and its version stays.


        Only an owner of the product may change its brand: its portal is the
        owner's to make up. Whoever else may know the product exists is
        refused (403 FORBIDDEN), whatever the request names: a member of one
        of its workspaces, and a platform administrator, who registers a
        product and gives it no brand. To anyone else there is no such
        product (404 PRODUCT_NOT_FOUND), the same as for a product that is
        missing. A suspended product takes no change (409
        PRODUCT_NOT_ACTIVE).


        The change, the audit record and the event are committed together or
        not at all. A 503 OUTCOME_UNCERTAIN means it is not known which: read
        before retrying.
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandChange'
      responses:
        '200':
          description: The product as it is now
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              description: A product is private to its members
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/products/{product_id}/role-assignments:
    get:
      operationId: listProductRoles
      summary: List the role assignments of a product
      description: >-
        Returns the role assignments in force of the product to an owner of
        it. It is where an owner finds the assignment of another: that of an
        owner named when the product was registered is in no other answer.
        Nobody else lists them. Whoever may know the product exists and does
        not own it is refused (403 FORBIDDEN): a member of one of its
        workspaces, and a platform administrator, who names an owner and
        reads none. To anyone else there is no such product (404
        PRODUCT_NOT_FOUND), the same as for a product that is missing. An
        assignment that was revoked is in no list.
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageToken'
      responses:
        '200':
          description: A page of the role assignments in force
          headers:
            Cache-Control:
              description: A role assignment is private to the owners of its product
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductRoleAssignmentList'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: grantProductRole
      summary: Make a principal hold a role in a product
      description: >-
        Makes the principal hold the role in the product, from now until the
        assignment is revoked. A product has four roles: product_owner,
        security_admin, security_reviewer and internal_auditor. An owner of
        the product may grant any of them, itself included: an owner that
        makes itself an auditor reads the audit records of the product then,
        and the grant is on record. A platform administrator may name owners
        and no other role (403 FORBIDDEN for the three that are left):
        naming the owners of a product is part of registering it, and it is
        how a product whose owner was mistyped is repaired. Naming an owner
        gives the administrator no view of what is inside the product. Nothing
        keeps it from naming itself, here as at registration: it is then an
        owner like any other, and the grant is on record. Whoever else may
        know the product exists, as a member of one of its workspaces does,
        is refused (403 FORBIDDEN); to anyone else there is no such product
        (404 PRODUCT_NOT_FOUND), the same as for a product that is missing. A
        role the principal holds in the product already is refused (409
        ROLE_ASSIGNMENT_EXISTS), and so are a product that is suspended (409
        PRODUCT_NOT_ACTIVE) and a principal under an issuer this deployment
        does not trust (422 OWNER_ISSUER_NOT_TRUSTED).


        The assignment, the audit record and the event are committed together
        or not at all. A 503 OUTCOME_UNCERTAIN means it is not known which:
        read before retrying.
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRoleGrant'
      responses:
        '201':
          description: The principal holds the role in the product
          headers:
            Location:
              description: Where the role assignment is read and revoked
              required: true
              schema:
                type: string
                format: uri-reference
            Cache-Control:
              description: A role assignment is private to the owners of its product
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductRoleAssignment'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/products/{product_id}/role-assignments/{role_assignment_id}:
    get:
      operationId: getProductRole
      summary: Read a role assignment of a product
      description: >-
        Returns a role assignment in force to an owner of the product. Nobody
        else reads one, and each is answered as far as it may know: a
        stranger is told there is no such product (404 PRODUCT_NOT_FOUND),
        and whoever knows the product and does not own it that there is no
        such role assignment (404 ROLE_ASSIGNMENT_NOT_FOUND). That is a
        member of one of its workspaces, and a platform administrator, who
        names an owner and reads none. An assignment that was revoked grants
        nothing and is not found either, and an assignment of another product
        is not found under this one.
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/RoleAssignmentId'
      responses:
        '200':
          description: The role assignment
          headers:
            Cache-Control:
              description: A role assignment is private to the owners of its product
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductRoleAssignment'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: revokeProductRole
      summary: Revoke a role assignment of a product
      description: >-
        Ends the assignment: from the moment the revocation is committed it
        grants nothing, and whoever is left with nothing in the product is a
        stranger to it. Only an owner of the product may, and an owner may
        revoke its own assignment. A platform administrator names owners and
        removes none. Whoever may know the product exists and does not own
        it, the administrator included, is refused (403 FORBIDDEN); to anyone
        else there is no such product (404 PRODUCT_NOT_FOUND). A product
        always has an owner: the last assignment in force that makes somebody
        one is not revoked (409 LAST_OWNER), and of two owners who revoke
        each other at the same time one stays. An assignment that is not in
        force is not found (404 ROLE_ASSIGNMENT_NOT_FOUND), whoever ended it,
        so a revocation that is sent again is answered so. The assignment is
        kept as a record, with who revoked it and when, and the role can be
        granted again as a new assignment.


        The revocation, the audit record and the event are committed together
        or not at all. A 503 OUTCOME_UNCERTAIN means it is not known which:
        read before retrying.
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/RoleAssignmentId'
      responses:
        '204':
          description: The role assignment was revoked
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/products/{product_id}/audit-records:
    get:
      operationId: listAuditRecords
      summary: List the audit records of a product
      description: >-
        Returns the audit records of the product to an auditor of it: a
        principal that holds the role internal_auditor in the product now.
        Nobody else reads them. An owner of the product does not by being one,
        nor does a platform administrator, nor whoever holds another role in
        the product: an owner that is to read them makes itself an auditor
        (grantProductRole), and that grant is on record. Whoever may know the
        product exists and is no auditor of it is refused (403 FORBIDDEN); to
        anyone else there is no such product (404 PRODUCT_NOT_FOUND), the same
        as for a product that is missing. What the caller holds is decided
        again with every page: a role that was revoked reads no page after
        it, whatever page token the caller holds. An auditor reads the records
        from the beginning, those recorded before it became one included.
        The role gives no other view of the product: no contract, no revision,
        no release and no publication.


        Only the records of this product are listed. A record that belongs to
        no product, such as the refusal of a request to register one, is not
        read here. A record says when it was recorded, who acted, what was
        attempted, how it ended, which rule decided it, and the kind and the
        identifier of the resource it names, if it left one behind; and the
        identifier of the request, which is the trace_id of its problem and
        ties it to its log lines and its events. The actor is the principal
        as it was recorded: the issuer and the subject, not masked. A record
        holds no token and no request body.


        The records are newest first, by the instant they were recorded and
        then by identifier. What is recorded while the list is read is newer
        than any position a page handed out and comes before it: it repeats
        no record that was read and takes nothing from the records that were
        not. Each filter keeps the records that match it exactly, and the
        filters narrow the list together; recorded_since is included and
        recorded_before is not. They are applied before paging: keep them the
        same when following a page token. A recorded_since that is not
        earlier than recorded_before is refused (422 REQUEST_UNPROCESSABLE).
        An instant is best sent in UTC, ending in Z. A numeric offset is read
        as well, but its + has to be percent-encoded (%2B08:00): left as it
        is, it is a space in a query and the request is refused (400
        REQUEST_INVALID). The trail keeps the microsecond: a finer instant is
        cut to it.


        A read that is answered leaves no audit record, as no read does. One
        that is refused does (audit.search, under DENY-03), unless there is no
        such product.
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageToken'
        - in: query
          name: recorded_since
          description: Only the records recorded at this instant or after it
          schema:
            type: string
            format: date-time
        - in: query
          name: recorded_before
          description: Only the records recorded before this instant
          schema:
            type: string
            format: date-time
        - in: query
          name: action
          schema:
            $ref: '#/components/schemas/AuditAction'
        - in: query
          name: outcome
          schema:
            $ref: '#/components/schemas/AuditOutcome'
        - in: query
          name: actor_issuer
          description: >-
            Only the records of principals under this issuer. It is asked for
            alone, or with actor_subject.
          schema:
            $ref: '#/components/schemas/Reference'
        - in: query
          name: actor_subject
          description: >-
            Only the records of this subject, under any issuer unless
            actor_issuer says which
          schema:
            $ref: '#/components/schemas/Reference'
        - in: query
          name: resource_type
          schema:
            $ref: '#/components/schemas/AuditResourceType'
        - in: query
          name: resource_id
          schema:
            $ref: '#/components/schemas/Identifier'
        - in: query
          name: correlation_id
          description: Only the records of the request that has this identifier
          schema:
            $ref: '#/components/schemas/Reference'
      responses:
        '200':
          description: A page of the audit records of the product
          headers:
            Cache-Control:
              description: An audit record is private to the auditors of its product
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditRecordList'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/products/{product_id}/assets:
    get:
      operationId: listAssets
      summary: List API assets the caller can read
      description: >-
        Lists a product's API assets in creation order. Product owners see
        the whole product. Other readers see only assets in workspaces where
        they are current members. A platform administrator without either
        relationship receives 403. Anyone who cannot know the product exists
        receives 404. Filters and text matching apply only to visible assets
        before paging. Keep the filters the same when following a page token.


        An asset carries an overview when the caller owns the product or
        holds internal_author, internal_reviewer or internal_publisher in the
        asset's workspace. These roles can read its revisions, checks and
        releases. An asset the caller reads without a contract read grant
        carries no overview.


        check_status and release_pending keep the assets whose overview says
        so. They narrow the list together with the other filters and, like
        them, before paging: a page is full unless it is the last, and the
        position a page token holds is that of the last asset of the page. An
        asset whose overview the caller does not read is not kept by either:
        product owners filter across the product. Other callers filter in
        the workspaces where they hold a contract read grant. A caller with
        no contract read grant is refused (403),
        and not answered with an empty page, which would say what the
        filter keeps. A filter keeps few assets, and finding them can take
        longer than a page that is not filtered.
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageToken'
        - in: query
          name: workspace_id
          schema:
            $ref: '#/components/schemas/Identifier'
        - in: query
          name: api_kind
          schema:
            $ref: '#/components/schemas/AssetKind'
        - in: query
          name: domain_key
          schema:
            $ref: '#/components/schemas/Key'
        - in: query
          name: q
          description: A literal substring of the asset key, display name or domain key, ignoring case
          schema:
            type: string
            minLength: 1
            maxLength: 120
            pattern: '^[^\p{Cc}]+$'
        - in: query
          name: check_status
          description: >-
            Only the assets whose latest revision has a latest check that
            concluded this. A revision that was approved with a waiver of
            the rule that failed is still one whose check failed.
          schema:
            $ref: '#/components/schemas/CheckRunStatus'
        - in: query
          name: release_pending
          description: >-
            Only the assets whose latest revision is APPROVED and that have no
            release prepared from it. There is no filter for the others.
          schema:
            type: boolean
            const: true
      responses:
        '200':
          description: One page of authorized assets
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetList'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
