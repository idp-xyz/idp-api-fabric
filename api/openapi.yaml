        product that have taken an operation, oldest first by the instant
        their first operation was accepted, then by slot_id. Only what was
        published is listed: a target the asset was never published to has no
        slot of it and is not listed, and a withdrawn slot is. Whoever may
        read the slots of the asset (getPublicationSlot) may read this list:
        an owner of the product or an author, reviewer or publisher of the
        workspace that owns it.
        Anyone who cannot know the product receives 404 PRODUCT_NOT_FOUND. A
        missing, cross-product or withheld asset returns API_ASSET_NOT_FOUND
        when the caller can know the product exists. A caller who may know
        the asset but cannot read its slots receives 403. An asset that is published nowhere has an empty list. Each item
        is the slot exactly as getPublicationSlot reads it, with blocked and
        approval_problem. approval_problem is worked out when the slot is
        read and is not stored, so the list cannot be filtered by it.
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/CheckAssetId'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageToken'
