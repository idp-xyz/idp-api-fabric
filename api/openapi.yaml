  /v1/products/{product_id}/publication-targets/{publication_target_id}/assets:
    get:
      operationId: listPublicationSlots
      summary: List the slots of a publication target that the caller may read
      description: >-
        Lists the slots of the target that have taken an operation, oldest
        first by the instant their first operation was accepted, then by
        slot_id. A slot keeps its place whatever is done to it later. Only
        what was published is listed: an asset that was never published to
        the target has no slot, which getPublicationSlot reads as empty, and
        a withdrawn slot is listed. Product owners see slots of the product.
        Other callers see slots of assets in workspaces where they are an
        author, reviewer or publisher, as in getPublicationSlot. The other slots are left out
        before the page is cut, so every page but the last is full. A caller
        who knows the product and reads none of its workspaces receives 403,
        and one who cannot know the product receives 404 PRODUCT_NOT_FOUND.
        A caller who reads a workspace without a slot on the target receives
        an empty list. A target the product does not have is answered with
        404 PUBLICATION_TARGET_NOT_FOUND to whoever may read. Each item is
        the slot exactly as getPublicationSlot reads it, with blocked and
        approval_problem. approval_problem is worked out when the slot is
        read and is not stored, so the list cannot be filtered by it.
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/PublicationTargetId'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageToken'
      responses:
        '200':
          description: One page of the slots the caller may read
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationSlotList'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
