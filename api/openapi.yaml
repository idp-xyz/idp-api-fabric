        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: requestRevisionReview
      summary: Submit a revision for review
      description: >-
        A current author of the asset's workspace asks for a decision on a
        revision of an active product. The request names one recorded check
        of the revision, the evidence the decision is asked on, and the scope
        the revision is to be approved for: audiences in environments.
        The check has to be one a decision can rest on now. A check made
        under another policy or by other tool versions than a check is made
        with today is refused (409 POLICY_STALE): run the check again. A
        check in which a rule that nothing waives failed or could not be
        judged is refused as well (409 REVIEW_BLOCKED): no decision approves
        such a revision.
        A revision is submitted as a DRAFT, or again once it was WITHDRAWN,
        and is IN_REVIEW from then on, under this one request. A revision
        that is IN_REVIEW or REJECTED is refused (409
        REVISION_STATUS_CONFLICT).
        A revision that is APPROVED is reviewed again the same way: for a
        scope its approval did not name, or once that approval holds no
        longer because it ran out, its reviewer lost the grant, or the
        policy and the tools moved on from its check. That review is
        supplementary. It moves nothing: the revision stays APPROVED while
        the review is open and however it ends, and what was approved before
        holds or lapses on its own terms. A revision is under one review at
        a time, so the request is refused while another review of it is
        open (409 REVIEW_IN_PROGRESS).
        The request, the status of the revision where it moves, the audit
        record and the event commit together.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewSubmission'
