      responses:
        '200':
          description: A page of slot operations
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationOperationList'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: changePublicationSlot
      summary: Activate, withdraw or restore a release with compare-and-swap
      description: >-
        The publisher names the generation read from the slot. An activation
        puts a release on the slot and requires an approval that holds for
        this target now: one that covers its audience and environment, whose
        reviewer still holds the grant, that has not run out and of which no
        waiver has, on a check of the current policy and tools that compared
        the revision with the one the slot served last, where that is another
        revision. A restoration returns the slot to a release it served
        before. Internal restoration verifies the approval as it was given.
        Partner restoration also requires the approval to hold now. An
        activation of a previously served release uses the same checks as
        any activation. Activation and restoration both require a publisher
        who took no part in the revision, its check or its approval, an
        active product and a release clear of access blocks. The configured
        CargoPai partner target supports publication when its partner origin
        and grant authority are configured. A withdrawal requires the
        publisher role alone. A completed retry returns the original operation.
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/PublicationTargetId'
        - $ref: '#/components/parameters/CheckAssetId'
        - name: Idempotency-Key
          in: header
          required: true
          description: A stable retry key scoped to the slot. Reusing it with changed input is a conflict.
          schema:
            type: string
            pattern: '^[A-Za-z0-9._:-]{1,128}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
