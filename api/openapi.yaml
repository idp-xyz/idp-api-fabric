    get:
      operationId: listPublicationOperations
      summary: Read a page of slot operations in generation order
      description: >-
        Product owners and current authors, reviewers and publishers of the
        asset's workspace can read this list.
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/PublicationTargetId'
