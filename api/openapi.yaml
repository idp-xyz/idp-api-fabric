        REVIEW_CONCLUDED). The conclusion, the status of the revision where
        it moves, the audit record and the event commit together.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewWithdrawal'
      responses:
