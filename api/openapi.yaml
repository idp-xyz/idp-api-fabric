        - $ref: '#/components/parameters/PublicationTargetId'
        - $ref: '#/components/parameters/AfterGeneration'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of access blocks
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessBlockList'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: blockPublicationAccess
      summary: Immediately block an origin target, slot or release
      description: >-
        A product security administrator supplies a reason. Omitting the asset
        blocks the target. Naming an asset blocks its slot, or one release when
        a release ID is given. The slot generation and pointer stay independent.
        A block covers what is read through the target: its slots and their
        artifacts. Whoever may read the release, an author, a reviewer or a
        publisher of the workspace of its asset, still downloads its artifact
        by the identifier of the release, with getContractReleaseArtifact.
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/PublicationTargetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessBlockRequest'
      responses:
        '200':
          description: An identical block is active already
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessBlock'
        '201':
          description: The block is active at the origin
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum: [no-store]
            Location:
              required: true
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessBlock'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/products/{product_id}/publication-targets/{publication_target_id}/access-blocks/{access_block_id}:
    get:
      operationId: getAccessBlock
      summary: Read a block and its clearance history
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/PublicationTargetId'
        - $ref: '#/components/parameters/AccessBlockId'
      responses:
        '200':
          description: The access block
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessBlock'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/products/{product_id}/publication-targets/{publication_target_id}/access-blocks/{access_block_id}/clearance:
    post:
      operationId: clearPublicationAccessBlock
      summary: Clear an access block after its affected releases are withdrawn
      description: >-
        A separate product security reviewer supplies a reason. Clearing a
        block does not restore a slot. Restore uses a new CAS and revalidates
        the publisher's independence and artifact integrity. Partner
        restoration also checks the current approval.
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/PublicationTargetId'
        - $ref: '#/components/parameters/AccessBlockId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessBlockClearance'
      responses:
        '200':
          description: The cleared access block
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessBlock'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        An access token of the identity provider this deployment trusts,
        addressed to this deployment. Fabric verifies tokens and never issues
        them. A token says who the caller is; what the caller may do is
        decided from the roles the server holds, so no scope is declared.
  parameters:
    PublicationTargetId:
      name: publication_target_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    ContractReleaseId:
      name: release_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    AccessBlockId:
      name: access_block_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    AfterGeneration:
      name: after_generation
      in: query
      description: The last generation from the previous page, or zero for the first page.
      schema:
        type: integer
        format: int64
        minimum: 0
    CheckAssetId:
      name: api_asset_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    CheckRevisionId:
      name: revision_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    ReviewId:
      name: review_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    ProductId:
      name: product_id
      in: path
      required: true
      description: The identifier of the product
      schema:
        $ref: '#/components/schemas/Identifier'
    WorkspaceId:
      name: workspace_id
      in: path
      required: true
      description: The identifier of the workspace
      schema:
        $ref: '#/components/schemas/Identifier'
    MembershipId:
      name: membership_id
      in: path
      required: true
      description: The identifier of the membership
      schema:
        $ref: '#/components/schemas/Identifier'
    RoleAssignmentId:
      name: role_assignment_id
      in: path
      required: true
      description: The identifier of the role assignment
      schema:
        $ref: '#/components/schemas/Identifier'
    AudienceConfigId:
      name: audience_config_id
      in: path
      required: true
      description: The identifier of the audience configuration
      schema:
        $ref: '#/components/schemas/Identifier'
    IfMatch:
      name: If-Match
      in: header
      description: >-
        The ETag the caller was answered with when it read what it changes,
        as it was given. The change is made only if that is still the
        version in force. A change needs it, and one without it is refused
        (428 PRECONDITION_REQUIRED) rather than made unconditionally, so the
        contract does not mark it required: a request that lacks it would be
        refused as one that does not match the contract. It names one
        version: "*", a list and a weak tag are refused (400 REQUEST_INVALID).
      schema:
        $ref: '#/components/schemas/EntityTag'
    PageSize:
      name: page_size
      in: query
      description: >-
        How many items the page holds at most. A list is read to its end by
        asking for the page that follows, never by asking for a larger one.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    PageToken:
      name: page_token
      in: query
      description: >-
        Where the page starts: the next_page_token of the page before, as it
        was given. Without it the list starts at its beginning. The token is
        opaque. It names a position in one list and grants nothing: what the
        caller may read is decided again with every page, from what it holds
        then. One that is not a token of this list is refused (400
        PAGE_TOKEN_INVALID).
      schema:
        type: string
        minLength: 1
        maxLength: 512
        pattern: '^[A-Za-z0-9_-]+$'
  responses:
    Problem:
      description: RFC 9457 problem with a stable error code
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthenticated:
      description: >-
        The request carries no credentials (CREDENTIALS_MISSING) or a token
        that is not accepted (TOKEN_INVALID). Why a token is not accepted is
        not said.
      headers:
        WWW-Authenticate:
          description: The Bearer challenge of RFC 6750
          required: true
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  headers:
    ETag:
      description: >-
        The version of what the answer shows, as an entity tag (RFC 9110). A
        change of it is made from this version: the caller sends it back in
        If-Match.
      required: true
      schema:
        $ref: '#/components/schemas/EntityTag'
  schemas:
    ReleasePreparation:
      type: object
      additionalProperties: false
      required: [revision_id, review_id, version]
      properties:
        revision_id:
          $ref: '#/components/schemas/Identifier'
        review_id:
          $ref: '#/components/schemas/Identifier'
        version:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._+-]{0,63}$'
    ContractRelease:
      type: object
      additionalProperties: false
      required: [release_id, product_id, workspace_id, api_asset_id, revision_id, review_id, check_run_id, policy_snapshot_id, policy_digest, ref_closure_digest, artifact_digest, artifact_format, version, status, prepared_at, prepared_by]
      properties:
        release_id:
          $ref: '#/components/schemas/Identifier'
        product_id:
          $ref: '#/components/schemas/Identifier'
        workspace_id:
          $ref: '#/components/schemas/Identifier'
        api_asset_id:
          $ref: '#/components/schemas/Identifier'
        revision_id:
          $ref: '#/components/schemas/Identifier'
        review_id:
          $ref: '#/components/schemas/Identifier'
        check_run_id:
          $ref: '#/components/schemas/Identifier'
        policy_snapshot_id:
          $ref: '#/components/schemas/Identifier'
        policy_digest:
          $ref: '#/components/schemas/ContractDigest'
        ref_closure_digest:
          $ref: '#/components/schemas/ContractDigest'
        artifact_digest:
          $ref: '#/components/schemas/ContractDigest'
        artifact_format:
          type: string
          enum: [fabric-openapi-source/v1]
        version:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._+-]{0,63}$'
        status:
          type: string
          enum: [READY]
        prepared_at:
          type: string
          format: date-time
        prepared_by:
          $ref: '#/components/schemas/Principal'
    ContractReleaseList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContractRelease'
        next_page_token:
          $ref: '#/components/schemas/NextPageToken'
    ContractReleaseProvenance:
      description: >-
        What a release was prepared on: the release, its revision, the check
        and the approval it rests on. All of it was recorded before the
        release was, and none of it changes with what is recorded after.
      type: object
      additionalProperties: false
      required: [release, revision, check, approval]
      properties:
        release:
          $ref: '#/components/schemas/ContractRelease'
        revision:
          $ref: '#/components/schemas/ReleaseProvenanceRevision'
        check:
          $ref: '#/components/schemas/ReleaseProvenanceCheck'
        approval:
          $ref: '#/components/schemas/ReleaseProvenanceApproval'
    ReleaseProvenanceRevision:
      description: >-
        The revision a release was prepared from: what it holds and where
        its source came from. Where the revision stands in its review is not
        part of it.
      type: object
      additionalProperties: false
      required: [revision_id, revision_sequence, source_kind, entrypoint, source_digest, ref_closure_digest]
      properties:
        revision_id:
          $ref: '#/components/schemas/Identifier'
        revision_sequence:
          type: integer
          format: int64
          minimum: 1
        source_kind:
          description: GIT for a source submitted with a Git origin, UPLOAD for one without
          type: string
          enum: [UPLOAD, GIT]
        git_origin:
          description: >-
            The origin the source was submitted with. It is present exactly
            when source_kind is GIT.
          $ref: '#/components/schemas/GitOrigin'
        entrypoint:
          description: The path of the entrypoint in the bundle of files that was submitted
          $ref: '#/components/schemas/ContractSourcePath'
        source_digest:
          $ref: '#/components/schemas/ContractDigest'
        ref_closure_digest:
          $ref: '#/components/schemas/ContractDigest'
    ReleaseProvenanceCheck:
      description: >-
        The check the approval of a release rests on: which check it was, the
        policy it was held to, the tools that evaluated it and what it
        concluded.
      type: object
      additionalProperties: false
      required: [check_run_id, policy_set_id, policy_digest, tool_manifest, status, summary, completed_at]
      properties:
        check_run_id:
          $ref: '#/components/schemas/Identifier'
        policy_set_id:
          type: string
        policy_digest:
          $ref: '#/components/schemas/ContractDigest'
        tool_manifest:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CheckRunTool'
        status:
          $ref: '#/components/schemas/CheckRunStatus'
        summary:
          $ref: '#/components/schemas/CheckRunSummary'
        completed_at:
          type: string
          format: date-time
    ReleaseProvenanceApproval:
      description: >-
        The approval a release was prepared under: which review it was, who
        approved, when, for what and until when, and the rules it let stand.
        It says nothing of whether the approval holds now.
      type: object
      additionalProperties: false
      required: [review_id, supplementary, scope, concluded_by, concluded_at, valid_until, waivers]
      properties:
        review_id:
          $ref: '#/components/schemas/Identifier'
        supplementary:
          description: Whether the revision was approved already when this review was asked for
          type: boolean
        scope:
          description: The targets the revision was approved for, by audience and then environment
          type: array
          minItems: 1
          maxItems: 6
          items:
            $ref: '#/components/schemas/ReviewTarget'
        concluded_by:
          $ref: '#/components/schemas/Principal'
        concluded_at:
          type: string
          format: date-time
        valid_until:
          description: Until when the approval held, as it was given
          type: string
          format: date-time
        waivers:
          description: >-
            The rules the approval let stand although they did not pass, by
            rule. Why is for the review to say.
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ReleaseProvenanceWaiver'
    ReleaseProvenanceWaiver:
      type: object
      additionalProperties: false
      required: [rule_id, expires_at]
      properties:
        rule_id:
          $ref: '#/components/schemas/ReviewRuleId'
        expires_at:
          description: Until when the waiver held, as it was given
          type: string
          format: date-time
    PublicationTargetRegistration:
      type: object
      additionalProperties: false
      required: [audience_config_id, portal_key]
      properties:
        audience_config_id:
          $ref: '#/components/schemas/Identifier'
        portal_key:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
    PublicationTarget:
      type: object
      additionalProperties: false
      required: [publication_target_id, product_id, audience_config_id, portal_key, audience, environment, block_generation, created_at]
      properties:
        publication_target_id:
          $ref: '#/components/schemas/Identifier'
        product_id:
          $ref: '#/components/schemas/Identifier'
        audience_config_id:
          $ref: '#/components/schemas/Identifier'
        portal_key:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
        audience:
          $ref: '#/components/schemas/Audience'
        environment:
          $ref: '#/components/schemas/Environment'
        block_generation:
          type: integer
          format: int64
          minimum: 0
        created_at:
          type: string
          format: date-time
    PublicationTargetList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicationTarget'
        next_page_token:
          $ref: '#/components/schemas/NextPageToken'
    PublicationSlot:
      type: object
      additionalProperties: false
      required: [publication_target_id, api_asset_id, generation, visibility, blocked, delivery_status]
      properties:
        slot_id:
          $ref: '#/components/schemas/Identifier'
        publication_target_id:
          $ref: '#/components/schemas/Identifier'
        api_asset_id:
          $ref: '#/components/schemas/Identifier'
        generation:
          type: integer
          format: int64
          minimum: 0
        visibility:
          type: string
          enum: [EMPTY, ACTIVE, WITHDRAWN]
        active_release_id:
          $ref: '#/components/schemas/Identifier'
        blocked:
          type: boolean
        approval_problem:
          description: >-
            Why the approval the active release rests on does not hold for
            this target now: the error code an activation of that release
            would be refused with. Absent when the approval holds and when
            no release is active. The slot retains the release pointer. The
            internal origin can still serve the artifact. The partner origin
            requires a current approval to serve that release.
          type: string
          enum: [APPROVAL_REQUIRED, APPROVAL_EXPIRED, WAIVER_EXPIRED, REVIEWER_AUTH_REVOKED, APPROVAL_SCOPE_MISMATCH, POLICY_STALE]
        delivery_status:
          type: string
          enum: [UNKNOWN]
    PublicationSlotList:
      description: >-
        One page of slots, oldest first by their first operation, each as
        getPublicationSlot reads it.
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/PublicationSlot'
        next_page_token:
          $ref: '#/components/schemas/NextPageToken'
    PublicationChange:
      type: object
      additionalProperties: false
      required: [action, expected_generation]
      properties:
        action:
          $ref: '#/components/schemas/PublicationAction'
        expected_generation:
          type: integer
          format: int64
          minimum: 0
        release_id:
          $ref: '#/components/schemas/Identifier'
        reason:
          type: string
          minLength: 1
          maxLength: 500
    PublicationOperation:
      type: object
      additionalProperties: false
      required: [operation_id, slot_id, generation, action, performed_by, occurred_at]
      properties:
        operation_id:
          $ref: '#/components/schemas/Identifier'
        slot_id:
          $ref: '#/components/schemas/Identifier'
        generation:
          type: integer
          format: int64
          minimum: 1
        action:
          $ref: '#/components/schemas/PublicationAction'
        previous_release_id:
          $ref: '#/components/schemas/Identifier'
        release_id:
          $ref: '#/components/schemas/Identifier'
        reason:
          type: string
          minLength: 1
          maxLength: 500
        performed_by:
          $ref: '#/components/schemas/Principal'
        occurred_at:
          type: string
          format: date-time
    PublicationOperationList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicationOperation'
        next_after_generation:
          type: integer
          format: int64
          minimum: 1
    AccessBlockRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        api_asset_id:
          $ref: '#/components/schemas/Identifier'
        release_id:
          $ref: '#/components/schemas/Identifier'
        reason:
          type: string
          minLength: 1
          maxLength: 500
    AccessBlockClearance:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
    AccessBlock:
      type: object
      additionalProperties: false
      required: [access_block_id, publication_target_id, product_id, generation, reason, created_by, created_at, status, edge_status]
      properties:
        access_block_id:
          $ref: '#/components/schemas/Identifier'
        publication_target_id:
          $ref: '#/components/schemas/Identifier'
        product_id:
          $ref: '#/components/schemas/Identifier'
        api_asset_id:
          $ref: '#/components/schemas/Identifier'
        release_id:
          $ref: '#/components/schemas/Identifier'
        generation:
          type: integer
          format: int64
          minimum: 1
        reason:
          type: string
          minLength: 1
          maxLength: 500
        created_by:
          $ref: '#/components/schemas/Principal'
        created_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [BLOCK_ACTIVE, CLEARED]
        edge_status:
          type: string
          enum: [UNKNOWN]
        clear_generation:
          type: integer
          format: int64
          minimum: 1
        clear_reason:
          type: string
          minLength: 1
          maxLength: 500
        cleared_by:
          $ref: '#/components/schemas/Principal'
        cleared_at:
          type: string
          format: date-time
    AccessBlockList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AccessBlock'
        next_after_generation:
          type: integer
          format: int64
          minimum: 1
    PublicationAction:
      type: string
      enum: [ACTIVATE, WITHDRAW, RESTORE]
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    BuildInfo:
      type: object
      required: [version, commit, built_at]
      properties:
        version:
          type: string
        commit:
          type: string
        built_at:
          type: string
    Identifier:
      description: >-
        The stable identity of an object: a UUID in its canonical form. It is
        never reused and says nothing about the object.
      type: string
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    Key:
      description: >-
        The name people and configuration use for an object, unique in its
        scope: 2 to 63 lower case letters, digits and hyphens, starting with a
        letter and not ending with a hyphen. It is not the identity of the
        object.
      type: string
      pattern: '^[a-z][a-z0-9-]{0,61}[a-z0-9]$'
    DisplayName:
      description: >-
        The name an object is shown under: 1 to 120 characters, without
        control characters and without surrounding white space. It identifies
        nothing and is not unique.
      type: string
      minLength: 1
      maxLength: 120
      pattern: '^[^\p{Z}\p{Cc}]([^\p{Cc}]*[^\p{Z}\p{Cc}])?$'
    Reference:
      description: >-
        A reference into another system, compared for equality and never
        interpreted: 1 to 255 characters, without control characters.
      type: string
      minLength: 1
      maxLength: 255
      pattern: '^[^\p{Cc}]+$'
    Principal:
      description: >-
        A user, a service account or a workload: a subject as one issuer
        names it. The same subject under another issuer is another principal.
      type: object
      additionalProperties: false
      required: [issuer, subject]
      properties:
        issuer:
          $ref: '#/components/schemas/Reference'
        subject:
          $ref: '#/components/schemas/Reference'
    Caller:
      description: >-
        Who the caller is: the principal its token is about, and whether the
        deployment names it an administrator of the platform. Nothing else of
        the token is passed on.
      type: object
      additionalProperties: false
      required: [principal, platform_administrator]
      properties:
        principal:
          $ref: '#/components/schemas/Principal'
        platform_administrator:
          description: >-
            Whether the principal administers the platform. It holds nothing in
            any product by being one.
          type: boolean
    CallerInProduct:
      description: >-
        What the caller holds in one product, as it is in force when the answer
        is given: its roles of the product and its roles in each workspace it
        is a member of. What was revoked is not shown, and neither is who
        granted what, or when.
      type: object
      additionalProperties: false
      required: [product_id, roles, workspaces]
      properties:
        product_id:
          $ref: '#/components/schemas/Identifier'
        roles:
          description: >-
            The roles of the product the caller holds, each once. Empty if it
            holds none. The order carries no meaning.
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ProductRole'
        workspaces:
          description: >-
            The workspaces of the product the caller is a member of, with its
            roles in each. It is not a page of a list and has no next_page_token:
            it has one item for each workspace the caller holds a membership
            in, all of them. An owner of the product reads every workspace of it
            without being a member of any, so this is what the caller holds, not
            what it may read. The order carries no meaning.
          type: array
          items:
            $ref: '#/components/schemas/CallerInWorkspace'
    CallerInWorkspace:
      description: >-
        What the caller holds in one workspace of the product: its roles there,
        each once. A workspace is shown for as long as the caller holds at
        least one.
      type: object
      additionalProperties: false
      required: [workspace_id, roles]
      properties:
        workspace_id:
          $ref: '#/components/schemas/Identifier'
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/WorkspaceRole'
    OrganizationRef:
      description: >-
        A reference to the organization a product belongs to, in the identity
        or organization system that knows it. It is recorded as it is given;
        no permission is derived from it.
      type: object
      additionalProperties: false
      required: [identity_provider, organization]
      properties:
        identity_provider:
          $ref: '#/components/schemas/Reference'
        organization:
          $ref: '#/components/schemas/Reference'
    ProductRegistration:
      type: object
      additionalProperties: false
      required: [product_key, display_name, owner_organization, owners]
      properties:
        product_key:
          description: Unique among all products
          $ref: '#/components/schemas/Key'
        display_name:
          $ref: '#/components/schemas/DisplayName'
        owner_organization:
          $ref: '#/components/schemas/OrganizationRef'
        owners:
          description: >-
            The principals that own the product from the start, each under a
            role assignment of its own. An owner manages the workspaces of
            the product, their members and who else owns it. Each is named
            under an issuer this deployment trusts.
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Principal'
    Product:
      type: object
      required: [product_id, product_key, display_name, status, owner_organization, brand, created_at]
      properties:
        product_id:
          $ref: '#/components/schemas/Identifier'
        product_key:
          $ref: '#/components/schemas/Key'
        display_name:
          $ref: '#/components/schemas/DisplayName'
        status:
          description: A suspended product takes no new work; what it holds is kept
          type: string
          enum: [ACTIVE, SUSPENDED]
        owner_organization:
          $ref: '#/components/schemas/OrganizationRef'
        brand:
          $ref: '#/components/schemas/Brand'
        created_at:
          type: string
          format: date-time
    LogoURL:
      description: >-
        Where the logo of a product is fetched from: an https URL of a host,
        by the rules of DocsURL, of at most 2048 characters. Fabric keeps it
        as it is given and never opens it, so it cannot tell what is there.
      type: string
      maxLength: 2048
      pattern: '^https://[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?)*(:([0-5]?[0-9]{1,4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5]))?([/?#]([^%\p{Z}\p{Cc}]|%[0-9A-Fa-f]{2})*)?$'
    Color:
      description: >-
        A colour: "#" and six hexadecimal digits, two each for red, green and
        blue, in either case. It is kept as it is given.
      type: string
      pattern: '^#[0-9A-Fa-f]{6}$'
    BrandChange:
      description: >-
        The brand a product is to have, as a whole. A body without logo_url
        says that the product has no logo, and one without primary_color that
        it has no colour.
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          description: The name the product presents itself under
          $ref: '#/components/schemas/DisplayName'
        logo_url:
          $ref: '#/components/schemas/LogoURL'
        primary_color:
          $ref: '#/components/schemas/Color'
    Brand:
      description: >-
        How a product presents itself to the developers it documents its APIs
        for: the name, the logo and the colour a portal of the product is
        made up with. Fabric keeps a brand and shows it; it renders nothing
        with it.
      type: object
      required: [name]
      properties:
        name:
          description: >-
            The name the product presents itself under: its display name
            until an owner changes the brand
          $ref: '#/components/schemas/DisplayName'
        logo_url:
          description: Absent for as long as the product has no logo
          $ref: '#/components/schemas/LogoURL'
        primary_color:
          description: Absent for as long as the product has no colour
          $ref: '#/components/schemas/Color'
    ProductRole:
      description: >-
        What a principal is in a product. A product_owner manages the
        workspaces, their members and product roles. A security_admin blocks
        publication access. A security_reviewer independently clears blocks.
        An internal_auditor reads the audit records of the product and nothing
        else. These roles are scoped to the product.
      type: string
      enum: [product_owner, security_admin, security_reviewer, internal_auditor]
    ProductRoleGrant:
      type: object
      additionalProperties: false
      required: [principal, role]
      properties:
        principal:
          $ref: '#/components/schemas/Principal'
        role:
          $ref: '#/components/schemas/ProductRole'
    ProductRoleAssignment:
      description: >-
        A principal that holds a role in one product. It is in force from
        granted_at until it is revoked; a revoked assignment is not shown.
      type: object
      required: [role_assignment_id, product_id, principal, role, granted_at]
      properties:
        role_assignment_id:
          $ref: '#/components/schemas/Identifier'
        product_id:
          $ref: '#/components/schemas/Identifier'
        principal:
          $ref: '#/components/schemas/Principal'
        role:
          $ref: '#/components/schemas/ProductRole'
        granted_at:
          type: string
          format: date-time
    AuditOutcome:
      description: >-
        How an attempt to act ended. SUCCEEDED is an action that was allowed
        and took effect. DENIED is one that was refused: nothing changed.
      type: string
      enum: [SUCCEEDED, DENIED]
    AuditAction:
      description: >-
        The smallest unit of what was attempted, such as product_role.grant:
        words of lower case letters, digits and underscores, joined by dots.
      type: string
      maxLength: 64
      pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'
    AuditResourceType:
      description: What was attempted on, such as RoleAssignment.
      type: string
      maxLength: 64
      pattern: '^[A-Za-z][A-Za-z0-9]*$'
    AuditRecord:
      description: >-
        The minimal fact of one attempt to act: who acted, what was attempted
        on which resource, when, how it ended and under which rule. It is as
        the trail holds it, and the trail holds references only: no token, no
        request body and no name of a private object.
      type: object
      additionalProperties: false
      required: [audit_id, recorded_at, actor, action, outcome, rule_id, product_id, resource_type, correlation_id]
      properties:
        audit_id:
          $ref: '#/components/schemas/Identifier'
        recorded_at:
          type: string
          format: date-time
        actor:
          $ref: '#/components/schemas/Principal'
        action:
          $ref: '#/components/schemas/AuditAction'
        outcome:
          $ref: '#/components/schemas/AuditOutcome'
        rule_id:
          description: >-
            The rule that allowed or refused the action, by its stable
            identifier in the access matrix, such as AC-10 or DENY-03.
          $ref: '#/components/schemas/Reference'
        product_id:
          $ref: '#/components/schemas/Identifier'
        resource_type:
          $ref: '#/components/schemas/AuditResourceType'
        resource_id:
          description: >-
            The resource the action was on. A refusal that left none behind
            names none, and the member is absent.
          $ref: '#/components/schemas/Identifier'
        correlation_id:
          description: >-
            Ties the record to the request, its log lines and its events: the
            trace_id of the problem that answered it.
          $ref: '#/components/schemas/Reference'
    CheckRunStatus:
      type: string
      enum: [PASS, WARN, FAIL, UNKNOWN]
    CheckRuleStatus:
      type: string
      enum: [PASS, WARN, FAIL, UNKNOWN, NOT_RUN]
    CheckRuleSeverity:
      type: string
      enum: [BLOCK, WARN]
    CheckRunTool:
      type: object
      additionalProperties: false
      required: [name, version]
      properties:
        name:
          type: string
        version:
          type: string
    CheckRunSummary:
      type: object
      additionalProperties: false
      required: [pass, warn, fail, unknown, not_run, finding_count]
      properties:
        pass:
          type: integer
          minimum: 0
        warn:
          type: integer
          minimum: 0
        fail:
          type: integer
          minimum: 0
        unknown:
          type: integer
          minimum: 0
        not_run:
          type: integer
          minimum: 0
        finding_count:
          description: Total findings before limiting the detail returned by each rule
          type: integer
          minimum: 0
    CheckRunOverview:
      type: object
      additionalProperties: false
      required: [check_run_id, product_id, api_asset_id, revision_id, input_digest, policy_snapshot_id, policy_set_id, policy_digest, tool_manifest, status, summary, started_at, completed_at]
      properties:
        check_run_id:
          $ref: '#/components/schemas/Identifier'
        product_id:
          $ref: '#/components/schemas/Identifier'
        api_asset_id:
          $ref: '#/components/schemas/Identifier'
        revision_id:
          $ref: '#/components/schemas/Identifier'
        input_digest:
          description: SHA-256 digest of the revision's reference closure
          $ref: '#/components/schemas/ContractDigest'
        policy_snapshot_id:
          $ref: '#/components/schemas/Identifier'
        policy_set_id:
          type: string
        policy_digest:
          $ref: '#/components/schemas/ContractDigest'
        tool_manifest:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CheckRunTool'
        status:
          $ref: '#/components/schemas/CheckRunStatus'
        summary:
          $ref: '#/components/schemas/CheckRunSummary'
        compatibility:
          $ref: '#/components/schemas/CheckRunComparison'
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
    CheckRuleOutcome:
      type: object
      additionalProperties: false
      required: [rule_id, description, category, severity, waivable, status, finding_count]
      properties:
        rule_id:
          type: string
        description:
          type: string
        category:
          type: string
        severity:
          $ref: '#/components/schemas/CheckRuleSeverity'
        waivable:
          type: boolean
        status:
          $ref: '#/components/schemas/CheckRuleStatus'
        finding_count:
          type: integer
          minimum: 0
        tool:
          $ref: '#/components/schemas/CheckRunTool'
    CheckRunFinding:
      type: object
      additionalProperties: false
      required: [rule_id, level, path, message]
      properties:
        rule_id:
          type: string
        level:
          $ref: '#/components/schemas/CheckRuleSeverity'
        path:
          $ref: '#/components/schemas/ContractSourcePath'
        pointer:
          description: JSON Pointer to the finding, when known
          type: string
        line:
          type: integer
          minimum: 1
        message:
          type: string
    CheckRun:
      type: object
      additionalProperties: false
      required: [check_run, outcomes, findings]
      properties:
        check_run:
          $ref: '#/components/schemas/CheckRunOverview'
        outcomes:
          type: array
          items:
            $ref: '#/components/schemas/CheckRuleOutcome'
        findings:
          type: array
          items:
            $ref: '#/components/schemas/CheckRunFinding'
        compatibility:
          $ref: '#/components/schemas/RevisionCompatibility'
    CheckRunComparison:
      type: object
      additionalProperties: false
      required: [baseline, classification, tool]
      properties:
        baseline:
          $ref: '#/components/schemas/ComparedRevision'
        classification:
          $ref: '#/components/schemas/CompatibilityClassification'
        tool:
          $ref: '#/components/schemas/CheckRunTool'
    CheckRunList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CheckRunOverview'
        next_page_token:
          $ref: '#/components/schemas/NextPageToken'
    ReviewTarget:
      description: >-
        One audience in one environment. The scope of a review is the targets
        a revision is asked to be approved for.
      type: object
      additionalProperties: false
      required: [audience, environment]
      properties:
        audience:
          $ref: '#/components/schemas/Audience'
        environment:
          $ref: '#/components/schemas/Environment'
    ReviewNote:
      description: >-
        What whoever asks for a review says of it: one line of 1 to 500
        characters, without control characters and without space around it.
      type: string
      minLength: 1
      maxLength: 500
      pattern: '^[^\p{Cc}]+$'
    ReviewReason:
      description: >-
        Why a review ended the way it did: one line of 1 to 1000 characters,
        without control characters and without space around it.
      type: string
      minLength: 1
      maxLength: 1000
      pattern: '^[^\p{Cc}]+$'
    ReviewSubmission:
      type: object
      additionalProperties: false
      required: [check_run_id, scope]
      properties:
        check_run_id:
          description: A recorded check of the revision, the evidence the decision is asked on
          $ref: '#/components/schemas/Identifier'
        scope:
          description: What the revision is to be approved for, each target once
          type: array
          minItems: 1
          maxItems: 6
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ReviewTarget'
        note:
          $ref: '#/components/schemas/ReviewNote'
    ReviewWithdrawal:
      type: object
      additionalProperties: false
      properties:
        reason:
          $ref: '#/components/schemas/ReviewReason'
    ReviewStatus:
      description: >-
        Where a review stands: IN_REVIEW until it is concluded, then the way
        it ended.
      type: string
      enum: [IN_REVIEW, WITHDRAWN, APPROVED, REJECTED]
    ReviewRuleId:
      description: The identifier a rule has in the policy of a check, as in F04-GOV-013
      type: string
      maxLength: 60
      pattern: '^[A-Z][A-Z0-9]*(-[A-Z0-9]+)+$'
    ReviewWaiver:
      description: >-
        One rule that did not pass and that an approval lets stand: why, what
        makes up for it if anything does, and until when. A waiver is part of
        the approval it was given with and holds for nothing else.
      type: object
      additionalProperties: false
      required: [rule_id, reason, expires_at]
      properties:
        rule_id:
          $ref: '#/components/schemas/ReviewRuleId'
        reason:
          $ref: '#/components/schemas/ReviewReason'
        compensating_control:
          description: What makes up for the rule that does not hold
          $ref: '#/components/schemas/ReviewReason'
        expires_at:
          description: Until when the waiver holds, no later than the approval
          type: string
          format: date-time
    ReviewDecision:
      description: >-
        What a reviewer decides with. A rejection gives its reason and nothing
        else. An approval gives the time it holds until and a waiver for
        every rule that failed or could not be judged; its reason is
        optional.
      type: object
      additionalProperties: false
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: [APPROVED, REJECTED]
        reason:
          $ref: '#/components/schemas/ReviewReason'
        valid_until:
          description: Until when an approval holds, at most a year away
          type: string
          format: date-time
        waivers:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ReviewWaiver'
    ReviewConclusion:
      description: >-
        How a review ended, who ended it and when. An approval says until
        when it holds and which rules it waives.
      type: object
      additionalProperties: false
      required: [outcome, concluded_by, concluded_at]
      properties:
        outcome:
          type: string
          enum: [WITHDRAWN, APPROVED, REJECTED]
        reason:
          $ref: '#/components/schemas/ReviewReason'
        concluded_by:
          $ref: '#/components/schemas/Principal'
        concluded_at:
          type: string
          format: date-time
        valid_until:
          description: Until when an approval holds
          type: string
          format: date-time
        waivers:
          description: The waivers of an approval, by rule
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ReviewWaiver'
    Review:
      description: >-
        A request for a decision on one revision, with its conclusion once it
        has one. Neither changes once it is recorded.
      type: object
      additionalProperties: false
      required: [review_id, product_id, api_asset_id, revision_id, check_run_id, input_digest, status, supplementary, scope, requested_by, requested_at]
      properties:
        review_id:
          $ref: '#/components/schemas/Identifier'
        product_id:
          $ref: '#/components/schemas/Identifier'
        api_asset_id:
          $ref: '#/components/schemas/Identifier'
        revision_id:
          $ref: '#/components/schemas/Identifier'
        check_run_id:
          description: The check the decision is asked on
          $ref: '#/components/schemas/Identifier'
        input_digest:
          description: What that check read, the reference closure digest of the revision
          $ref: '#/components/schemas/ContractDigest'
        status:
          $ref: '#/components/schemas/ReviewStatus'
        supplementary:
          description: >-
            Whether the revision was APPROVED already when the review was
            asked for. Such a review does not move the revision.
          type: boolean
        scope:
          description: The targets the revision is to be approved for, by audience and then environment
          type: array
          minItems: 1
          maxItems: 6
          items:
            $ref: '#/components/schemas/ReviewTarget'
        note:
          $ref: '#/components/schemas/ReviewNote'
        requested_by:
          $ref: '#/components/schemas/Principal'
        requested_at:
          type: string
          format: date-time
        conclusion:
          $ref: '#/components/schemas/ReviewConclusion'
    ReviewList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Review'
        next_page_token:
          $ref: '#/components/schemas/NextPageToken'
    ContractSourcePath:
      type: string
      minLength: 1
      maxLength: 200
      pattern: '^[a-zA-Z0-9._-]+(/[a-zA-Z0-9._-]+)*$'
    ContractSourceFile:
      type: object
      required: [path, content_base64]
      additionalProperties: false
      properties:
        path:
          $ref: '#/components/schemas/ContractSourcePath'
        content_base64:
          description: Base64-encoded original UTF-8 bytes
          type: string
          minLength: 4
          maxLength: 54616
    ContractSourceUpload:
      type: object
      required: [entrypoint, files]
      additionalProperties: false
      properties:
        entrypoint:
          $ref: '#/components/schemas/ContractSourcePath'
        files:
          type: array
          minItems: 1
          maxItems: 16
          items:
            $ref: '#/components/schemas/ContractSourceFile'
        git_origin:
          description: >-
            Where the files came from, when they were read from a Git
            repository. Without it the source is recorded as an upload.
          $ref: '#/components/schemas/GitOrigin'
    GitRepository:
      description: >-
        A Git repository, as the https URL it is known under, written one
        way: the host in lower case with nothing in front of it, so the URL
        carries no credentials, an optional port, and a path of one or more
        segments of letters, digits, ".", "_", "~" and "-" without a trailing
        slash, a query or a fragment. It is at most 300 characters. A
        repository is compared as it is written, so the same repository with
        and without ".git" is two. Fabric keeps the URL as it is given and
        never opens it.
      type: string
      maxLength: 300
      pattern: '^https://[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)*(:([1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5]))?(/[A-Za-z0-9._~-]*[A-Za-z0-9_~-][A-Za-z0-9._~-]*)+$'
    GitCommit:
      description: >-
        The full name of a commit: 40 hexadecimal digits for SHA-1 or 64 for
        SHA-256, in lower case. An abbreviation, a branch and a tag are
        refused: each of them can name another commit tomorrow.
      type: string
      pattern: '^([0-9a-f]{40}|[0-9a-f]{64})$'
    GitRef:
      description: >-
        The full name of a branch, a tag or another reference, as in
        refs/heads/main or refs/tags/v1.2.0: at most 200 characters, without
        white space or control characters.
      type: string
      maxLength: 200
      pattern: '^refs/[^\p{Z}\p{Cc}]+$'
    GitOrigin:
      description: >-
        Where the submitter of a source says its files came from. It is a
        declaration: Fabric records it with who made it and does not read the
        repository, so it is evidence of what was said, not proof of what the
        commit holds.
      type: object
      additionalProperties: false
      required: [repository, commit]
      properties:
        repository:
          $ref: '#/components/schemas/GitRepository'
        commit:
          description: The commit the files were read at
          $ref: '#/components/schemas/GitCommit'
        ref:
          description: >-
            The branch or tag that pointed at the commit when the files were
            read. It is informational: a reference moves, the commit does not.
          $ref: '#/components/schemas/GitRef'
    CompatibilityClassification:
      type: string
      enum: [COMPATIBLE, RISKY, UNKNOWN, BREAKING]
    ComparedRevision:
      type: object
      required: [revision_id, input_digest]
      additionalProperties: false
      properties:
        revision_id:
          $ref: '#/components/schemas/Identifier'
        input_digest:
          $ref: '#/components/schemas/ContractDigest'
    CompatibilityChange:
      type: object
      required: [classification, code]
      additionalProperties: false
      properties:
        classification:
          $ref: '#/components/schemas/CompatibilityClassification'
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
          maxLength: 64
        pointer:
          description: JSON Pointer in the relevant revision's entrypoint
          type: string
          maxLength: 1024
    RevisionCompatibility:
      type: object
      required: [baseline, candidate, tool, classification, changes, truncated]
      additionalProperties: false
      properties:
        baseline:
          $ref: '#/components/schemas/ComparedRevision'
        candidate:
          $ref: '#/components/schemas/ComparedRevision'
        tool:
          $ref: '#/components/schemas/CheckRunTool'
        classification:
          $ref: '#/components/schemas/CompatibilityClassification'
        changes:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/CompatibilityChange'
        truncated:
          type: boolean
    ContractDigest:
      type: string
      pattern: '^sha256:[a-f0-9]{64}$'
    ContractRevision:
      type: object
      required: [revision_id, source_snapshot_id, product_id, api_asset_id, revision_sequence, status, source_kind, entrypoint, spec_version, source_digest, ref_closure_digest, created_at]
      additionalProperties: false
      properties:
        revision_id:
          $ref: '#/components/schemas/Identifier'
        source_snapshot_id:
          $ref: '#/components/schemas/Identifier'
        product_id:
          $ref: '#/components/schemas/Identifier'
        api_asset_id:
          $ref: '#/components/schemas/Identifier'
        revision_sequence:
          type: integer
          format: int64
          minimum: 1
        status:
          description: >-
            Where the revision stands in its review. It is recorded as a
            DRAFT, is IN_REVIEW from the moment it is submitted, and leaves
            the review APPROVED, REJECTED or WITHDRAWN. Its content is the
            same at every status.
          type: string
          enum: [DRAFT, IN_REVIEW, APPROVED, REJECTED, WITHDRAWN]
        source_kind:
          description: GIT for a source submitted with a Git origin, UPLOAD for one without
          type: string
          enum: [UPLOAD, GIT]
        git_origin:
          description: >-
            The origin the source was submitted with. It is present exactly
            when source_kind is GIT.
          $ref: '#/components/schemas/GitOrigin'
        entrypoint:
          $ref: '#/components/schemas/ContractSourcePath'
        spec_version:
          type: string
          const: '3.1.2'
        source_digest:
          $ref: '#/components/schemas/ContractDigest'
        ref_closure_digest:
          $ref: '#/components/schemas/ContractDigest'
        created_at:
          type: string
          format: date-time
    ContractRevisionList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContractRevision'
        next_page_token:
          $ref: '#/components/schemas/NextPageToken'
    ContractRecordedFile:
      description: One file of a recorded source, as it was submitted
      type: object
      required: [path, digest, content_base64]
      additionalProperties: false
      properties:
        path:
          $ref: '#/components/schemas/ContractSourcePath'
        digest:
          description: The SHA-256 digest of the bytes of the file
          $ref: '#/components/schemas/ContractDigest'
        content_base64:
          description: The bytes of the file in standard Base64
          type: string
          minLength: 4
          maxLength: 54616
    ContractRevisionSource:
      description: >-
        The files a revision was recorded from, with the digests the
        revision carries for them.
      type: object
      required: [revision_id, source_snapshot_id, entrypoint, source_digest, ref_closure_digest, files]
      additionalProperties: false
      properties:
        revision_id:
          $ref: '#/components/schemas/Identifier'
        source_snapshot_id:
          $ref: '#/components/schemas/Identifier'
        entrypoint:
          description: The path of the file the others are referenced from
          $ref: '#/components/schemas/ContractSourcePath'
        source_digest:
          description: The digest of the entrypoint
          $ref: '#/components/schemas/ContractDigest'
        ref_closure_digest:
          description: >-
            The digest of the closure: the entrypoint and the path and
            digest of every file
          $ref: '#/components/schemas/ContractDigest'
        files:
          description: The entrypoint and every file it references, in the order of their paths
          type: array
          minItems: 1
          maxItems: 16
          items:
            $ref: '#/components/schemas/ContractRecordedFile'
    AssetKind:
      type: string
      enum: [HTTP, EVENT]
    AssetRegistration:
      type: object
      additionalProperties: false
      required: [workspace_id, asset_key, display_name, domain_key, api_kind]
      properties:
        workspace_id:
          description: The owning workspace in the product
          $ref: '#/components/schemas/Identifier'
        asset_key:
          $ref: '#/components/schemas/Key'
        display_name:
          $ref: '#/components/schemas/DisplayName'
        domain_key:
          $ref: '#/components/schemas/Key'
        api_kind:
          $ref: '#/components/schemas/AssetKind'
    APIAsset:
      type: object
      required: [api_asset_id, product_id, workspace_id, asset_key, display_name, domain_key, api_kind, lifecycle, created_at]
      properties:
        api_asset_id:
          $ref: '#/components/schemas/Identifier'
        product_id:
          $ref: '#/components/schemas/Identifier'
        workspace_id:
          description: The owning workspace
          $ref: '#/components/schemas/Identifier'
        asset_key:
          $ref: '#/components/schemas/Key'
        display_name:
          $ref: '#/components/schemas/DisplayName'
        domain_key:
          $ref: '#/components/schemas/Key'
        api_kind:
          $ref: '#/components/schemas/AssetKind'
        lifecycle:
          type: string
          enum: [EXPERIMENTAL, STABLE, DEPRECATED, RETIRED]
        created_at:
          type: string
          format: date-time
        overview:
          description: >-
            Where the asset stands. Present for a product owner or a current
            author, reviewer or publisher of the workspace that owns it.
            Only the reads of an asset carry it.
          $ref: '#/components/schemas/AssetOverview'
    AssetOverview:
      description: >-
        Where an asset stands on its way from a revision to a release, read
        from what Contract Registry and Policy & Review record at the time it
        is asked for. Each member is what the read of the same thing gives
        under the same name: latest_revision is the revision with the
        greatest revision_sequence, as getRevision gives it; latest_check is
        the check of that revision that was concluded last, as
        listRevisionChecks lists it; latest_release is the release that was
        prepared last, as listContractReleases lists it. An asset that has no
        revision has only release_pending.
      type: object
      additionalProperties: false
      required: [release_pending]
      properties:
        latest_revision:
          $ref: '#/components/schemas/OverviewRevision'
        latest_check:
          description: Absent while the latest revision has no check
          $ref: '#/components/schemas/OverviewCheck'
        latest_release:
          description: Absent while the asset has no release
          $ref: '#/components/schemas/OverviewRelease'
        release_pending:
          description: >-
            True when the latest revision is APPROVED and no release was
            prepared from it. It does not say that the approval still holds:
            it may have run out, a waiver of it may have, its reviewer may
            have lost the grant, or the policy and the tools may have moved on.
            prepareContractRelease asks that when a release is prepared.
          type: boolean
    OverviewRevision:
      description: The latest revision of an asset, as getRevision gives it
      type: object
      additionalProperties: false
      required: [revision_id, revision_sequence, status, created_at]
      properties:
        revision_id:
          $ref: '#/components/schemas/Identifier'
        revision_sequence:
          type: integer
          format: int64
          minimum: 1
        status:
          type: string
          enum: [DRAFT, IN_REVIEW, APPROVED, REJECTED, WITHDRAWN]
        created_at:
          type: string
          format: date-time
    OverviewCheck:
      description: The check of the latest revision that was concluded last, as listRevisionChecks lists it
      type: object
      additionalProperties: false
      required: [check_run_id, status, completed_at]
      properties:
        check_run_id:
          $ref: '#/components/schemas/Identifier'
        status:
          $ref: '#/components/schemas/CheckRunStatus'
        completed_at:
          type: string
          format: date-time
    OverviewRelease:
      description: >-
        The release of an asset that was prepared last, as listContractReleases
        lists it, whichever revision it was prepared from
      type: object
      additionalProperties: false
      required: [release_id, revision_id, version, prepared_at]
      properties:
        release_id:
          $ref: '#/components/schemas/Identifier'
        revision_id:
          $ref: '#/components/schemas/Identifier'
        version:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._+-]{0,63}$'
        prepared_at:
          type: string
          format: date-time
    AssetList:
      description: One page of the product's visible assets, oldest first
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/APIAsset'
        next_page_token:
          $ref: '#/components/schemas/NextPageToken'
    Audience:
      description: >-
        Who a product documents its APIs for. public is anybody, signed in or
        not; partner is the external developers of the organizations the
        product gives access to; internal is the engineers of IDP. What each
        of them may read is a rule of the platform, the same for every
        product, so a product names no audience of its own.
      type: string
      enum: [public, partner, internal]
    Environment:
      description: >-
        Where the APIs a product documents run: a sandbox is where a developer
        tries an API, production is where its business runs.
      type: string
      enum: [sandbox, production]
    DocsURL:
      description: >-
        Where an audience enters the documentation: an https URL of a host,
        with an optional port of at most 65535 and valid percent escapes.
        Whitespace and control characters are not allowed. The URL is at
        most 2048 characters. A host whose name is not
        ASCII is given in its punycode form, and nothing stands in front of
        the host, so the URL carries no credentials. Fabric keeps it as it is
        given and never opens it, so it cannot tell whether the host belongs
        to the product.
      type: string
      maxLength: 2048
      pattern: '^https://[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?)*(:([0-5]?[0-9]{1,4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5]))?([/?#]([^%\p{Z}\p{Cc}]|%[0-9A-Fa-f]{2})*)?$'
    EntityTag:
      description: >-
        A version as an entity tag (RFC 9110): its number, in double quotes.
        The caller sends it back as it was given.
      type: string
      pattern: '^"[1-9][0-9]{0,17}"$'
    AudienceConfigCreation:
      type: object
      additionalProperties: false
      required: [audience, environment]
      properties:
        audience:
          $ref: '#/components/schemas/Audience'
        environment:
          $ref: '#/components/schemas/Environment'
        docs_url:
          description: >-
            Where the audience enters the documentation of the environment.
            Without it, nobody said where yet.
          $ref: '#/components/schemas/DocsURL'
    AudienceConfigChange:
      description: >-
        What can change of an audience configuration, as it is to be. A body
        without docs_url says that there is no entry.
      type: object
      additionalProperties: false
      properties:
        docs_url:
          $ref: '#/components/schemas/DocsURL'
    AudienceConfig:
      description: >-
        A product documents its APIs for one audience in one environment. The
        configuration is in force from created_at until it is removed; a
        removed configuration is not shown.
      type: object
      required: [audience_config_id, product_id, audience, environment, created_at, updated_at]
      properties:
        audience_config_id:
          $ref: '#/components/schemas/Identifier'
        product_id:
          $ref: '#/components/schemas/Identifier'
        audience:
          $ref: '#/components/schemas/Audience'
        environment:
          $ref: '#/components/schemas/Environment'
        docs_url:
          description: Absent for as long as nobody said where the audience enters the documentation
          $ref: '#/components/schemas/DocsURL'
        created_at:
          type: string
          format: date-time
        updated_at:
          description: When the entry last changed, or created_at until it does
          type: string
          format: date-time
    WorkspaceCreation:
      type: object
      additionalProperties: false
      required: [workspace_key, display_name]
      properties:
        workspace_key:
          description: Unique among the workspaces of the product
          $ref: '#/components/schemas/Key'
        display_name:
          $ref: '#/components/schemas/DisplayName'
    Workspace:
      type: object
      required: [workspace_id, product_id, workspace_key, display_name, status, created_at]
      properties:
        workspace_id:
          $ref: '#/components/schemas/Identifier'
        product_id:
          description: The product the workspace belongs to, for good
          $ref: '#/components/schemas/Identifier'
        workspace_key:
          $ref: '#/components/schemas/Key'
        display_name:
          $ref: '#/components/schemas/DisplayName'
        status:
          type: string
          enum: [ACTIVE]
        created_at:
          type: string
          format: date-time
    WorkspaceRole:
      description: >-
        What a member is in a workspace. A workspace_maintainer creates and
        updates the API assets of the workspace; an internal_author writes and
        reads its contract revisions and runs their checks; an
        internal_reviewer reads revisions and checks and decides on reviews.
        An internal_publisher prepares and publishes approved releases.
        Owners of the product manage the workspace and its members.
      type: string
      enum: [workspace_maintainer, internal_author, internal_reviewer, internal_publisher]
    MembershipGrant:
      type: object
      additionalProperties: false
      required: [member, role]
      properties:
        member:
          $ref: '#/components/schemas/Principal'
        role:
          $ref: '#/components/schemas/WorkspaceRole'
    Membership:
      description: >-
        A principal that holds a role in one workspace. It is in force from
        granted_at until it is revoked; a revoked membership is not shown.
      type: object
      required: [membership_id, product_id, workspace_id, member, role, granted_at]
      properties:
        membership_id:
          $ref: '#/components/schemas/Identifier'
        product_id:
          description: The product the workspace belongs to
          $ref: '#/components/schemas/Identifier'
        workspace_id:
          $ref: '#/components/schemas/Identifier'
        member:
          $ref: '#/components/schemas/Principal'
        role:
          $ref: '#/components/schemas/WorkspaceRole'
        granted_at:
          type: string
          format: date-time
    NextPageToken:
      description: >-
        The page_token of the page that follows this one, to be sent back as
        it is. A page carries it for as long as items follow: the last page
        of a list has none, also when it is full.
      type: string
      minLength: 1
      maxLength: 512
      pattern: '^[A-Za-z0-9_-]+$'
    ProductList:
      description: One page of the products the caller may read, oldest first.
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Product'
        next_page_token:
          $ref: '#/components/schemas/NextPageToken'
    WorkspaceList:
      description: >-
        One page of the workspaces of a product the caller may read, oldest
        first.
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Workspace'
        next_page_token:
          $ref: '#/components/schemas/NextPageToken'
    MembershipList:
      description: >-
        One page of the memberships in force of a workspace, in the order
        they were granted.
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Membership'
        next_page_token:
          $ref: '#/components/schemas/NextPageToken'
    ProductRoleAssignmentList:
      description: >-
        One page of the role assignments in force of a product, in the order
        they were granted.
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ProductRoleAssignment'
        next_page_token:
          $ref: '#/components/schemas/NextPageToken'
    AuditRecordList:
      description: >-
        One page of the audit records of a product, newest first.
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/AuditRecord'
        next_page_token:
          $ref: '#/components/schemas/NextPageToken'
    AudienceConfigList:
      description: >-
        One page of the audience configurations in force of a product, oldest
        first.
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/AudienceConfig'
        next_page_token:
          $ref: '#/components/schemas/NextPageToken'
    Problem:
      description: >-
        The error body of every operation. Callers branch on error_code, never
        on title or detail.
      type: object
      required: [type, title, status, error_code]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        error_code:
          type: string
        trace_id:
          description: Ties the problem to the log lines and the audit record of the request
          type: string
