  /v1/products/{product_id}/assets/{api_asset_id}/releases/{release_id}/artifact:
    get:
      operationId: getContractReleaseArtifact
      summary: Download the artifact of a release of the API asset by the identifier of the release
      description: >-
        The octet stream contains the exact bytes the release was prepared
        with, and their SHA-256 digest is the X-Artifact-Digest of the answer:
        the artifact_digest the release records. The release is named by its
        identifier under its asset, so it is downloaded whatever a
        publication slot points at, and whatever was released after it.
        Whoever may read the release may download it: an owner of the product
        or an author, reviewer or publisher of the workspace, including while
        the product is suspended. The download does not look at an access block on a
        publication target, which belongs to the read of an artifact through
        the slot of a target, and does not verify the approval of the release
        again, which no read does.
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/CheckAssetId'
        - $ref: '#/components/parameters/ContractReleaseId'
