  /v1/products/{product_id}/publication-targets/{publication_target_id}/assets/{api_asset_id}:
    get:
      operationId: getPublicationSlot
      summary: Read the current publication slot and its generation
      description: >-
        Product owners and current authors, reviewers and publishers of the
        asset's workspace can read its slot.
        An asset without a slot starts at generation zero. The slot reports the
        database pointer, origin blocking, and the separate delivery status.
        It also says whether the approval the active release rests on still
        holds for this target. The slot keeps its pointer when an approval
        stops holding. The internal origin serves the artifact until the slot
        is withdrawn or blocked. The partner origin requires a current
        approval. approval_problem names why the release would not be
        activated today. A supplementary review lets the revision be
        released and activated with new approval evidence.
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/PublicationTargetId'
        - $ref: '#/components/parameters/CheckAssetId'
