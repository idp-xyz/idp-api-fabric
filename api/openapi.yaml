    post:
      operationId: registerAsset
      summary: Register an API asset in a workspace
      description: >-
        A current workspace maintainer can register an asset in that
        workspace of an active product (AC-11). The workspace is the owner.
        The server supplies a stable ID and the initial EXPERIMENTAL
        lifecycle. The same asset_key can appear in different products.
        Within one product it is unique across all workspaces
        (409 API_ASSET_KEY_TAKEN). A known product with an inaccessible or
        missing workspace returns 404 WORKSPACE_NOT_FOUND. A caller who
        knows the workspace without a maintainer membership receives 403.
        Registration commits the asset, audit record and outbox event together.
