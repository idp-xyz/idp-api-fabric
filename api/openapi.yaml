      summary: Read the files a draft revision was recorded from
      description: >-
        A product owner or a current author, reviewer or publisher of the
        asset's workspace may read the source. The access response follows
        getRevision, and a revision from a different asset is
        indistinguishable from one that is missing.
        The answer holds the closure that was recorded: the entrypoint and
        every file it references, byte for byte as they were submitted, in
        the order of their paths. A file that was submitted with the bundle
        and referenced by nothing was not recorded and is not here.
        Each file carries the SHA-256 digest of its bytes, the digest of the
        entrypoint is the source_digest of the revision, and
        ref_closure_digest covers the entrypoint and the path and digest of
        every file. Fabric computes the digests again from what it stored
        before it answers. Files that are no longer the ones the revision
        was recorded from are not handed out: the request fails with 500
        INTERNAL_ERROR and the cause is logged for whoever operates the
        service.
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - name: api_asset_id
