        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/products/{product_id}/publication-targets/{publication_target_id}/assets/{api_asset_id}/artifact:
    get:
      operationId: getPublishedArtifact
      summary: Download the current authorized artifact from the internal origin
      description: >-
        The octet stream contains the exact release JSON bytes. The origin
        checks the owner's or member's current read grant, target configuration,
        the active pointer and effective access blocks on every read, and the
        bytes against the digest of the release. It does not ask whether the
