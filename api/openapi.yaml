        '201':
          description: >-
            The review was asked for. The revision is in review, or stays
            approved under a supplementary review
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri-reference
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
          content:
