  /v1/products/{product_id}/assets/{api_asset_id}/revisions/{revision_id}/reviews/{review_id}/decision:
    parameters:
      - $ref: '#/components/parameters/ProductId'
      - $ref: '#/components/parameters/CheckAssetId'
      - $ref: '#/components/parameters/CheckRevisionId'
      - $ref: '#/components/parameters/ReviewId'
    post:
      operationId: decideRevisionReview
      summary: Approve or reject a revision that is in review
      description: >-
        A current reviewer of the asset's workspace decides on an open
        review of a revision of an active product: the revision is APPROVED
        or REJECTED from then on, and the review is concluded.
        A supplementary review leaves the revision APPROVED either way. Its
        approval is another approval of the same content, for the scope and
        the time it names; its rejection takes back nothing that was
        approved before.
        Whoever decides had no part in what is reviewed. Whoever recorded
        the revision, ran the check the review rests on or asked for the
        review is refused (403 REVIEWER_NOT_INDEPENDENT), also when holding
        the reviewer role.
        A rejection says why. An approval rests on the check of the review
        as the request did: a check that is no longer one of the current
        policy and tool versions is refused (409 POLICY_STALE). Every rule
        that failed or could not be judged in that check is waived by name,
        for a reason and until a time; an approval that leaves one out is
        refused (409 WAIVER_REQUIRED). A rule that nothing waives is never
        waived (422 WAIVER_FORBIDDEN). A rule that warns and a rule no tool
        evaluates need no waiver: the approval is bound to the check that
        says so. The approval holds until valid_until, which is at most a
        year away, and no waiver outlives it.
        An approval approves the content the check read, for the scope of
        the request and until its time, and nothing wider. The conclusion,
        its waivers, the status of the revision where it moves, the audit
        record and the event commit together.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewDecision'
      responses:
        '200':
          description: The review was decided
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/products/{product_id}/workspaces/{workspace_id}/reviews:
    get:
      operationId: listWorkspaceReviews
      summary: List the reviews of a workspace
      description: >-
        Lists the reviews of every revision of every asset the workspace
        owns, oldest first by the instant they were asked for and then by
        review_id: the queue a reviewer reads to find what waits for a
        decision (status IN_REVIEW) and an author reads to find what became
        of what it asked. A review keeps its place for as long as it is
        listed. What is asked for while the list is read comes after every
        position a page handed out: it repeats no review that was read and
        takes none from those that were not.

        A product owner or a current author, reviewer or publisher of the
        workspace reads every review of it, as getRevisionReview reads each one alone, and each
        item is the review that operation answers. The two differ in one
        check only: getRevisionReview verifies that the review still rests
        on the content its revision has now (input_digest), which needs the
        revision, and this list does not. A review whose recorded rows are
        not what was recorded fails the page (500 INTERNAL_ERROR) without
        saying why.

        Whoever may not read is answered as far as it may know. A caller
        that may not know the product receives 404 PRODUCT_NOT_FOUND, the
        same as for a product that is missing. One that knows the product
        and is neither an owner of it nor a member of the workspace
        receives 404 WORKSPACE_NOT_FOUND, the same as for a workspace the
        product has not, and for a workspace of another product. A non-owner
        member who holds none of the three grants receives 403 FORBIDDEN.
        An owner that asks for a
        workspace the product has not receives 404 WORKSPACE_NOT_FOUND. A
        caller that reads a workspace in which no review was asked for
        receives an empty list. What the caller holds is decided again with
        every page: a grant that was revoked reads no page after it,
        whatever page token the caller holds.

        status keeps the list to the reviews that stand at it. IN_REVIEW is
        a review that has no conclusion yet, a supplementary review of an
        APPROVED revision included, which leaves that revision APPROVED; the
        others are the way a review ended. requested_by_issuer and
        requested_by_subject keep it to the reviews a principal asked for:
        the issuer alone, the subject alone under any issuer, or both. Each
        filter keeps the reviews that match it exactly, and the filters
        narrow the list together. They are applied before paging, so every
        page but the last is full: keep them the same when following a page
        token, which names a position and not a filter.

        A read that is answered leaves no audit record, as no read does. One
        that is refused does (review.read, under DENY-03), unless the
        product is missing or an owner asked for a workspace the product
        has not.
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageToken'
        - in: query
          name: status
          description: Only the reviews that stand at this status
          schema:
            $ref: '#/components/schemas/ReviewStatus'
        - in: query
          name: requested_by_issuer
          description: >-
            Only the reviews asked for by principals under this issuer. It is
            asked for alone, or with requested_by_subject.
          schema:
            $ref: '#/components/schemas/Reference'
        - in: query
          name: requested_by_subject
          description: >-
            Only the reviews this subject asked for, under any issuer unless
            requested_by_issuer says which
          schema:
            $ref: '#/components/schemas/Reference'
      responses:
        '200':
          description: One page of the reviews of the workspace
          headers:
            Cache-Control:
              description: A review is private to whoever reads the reviews of its workspace
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewList'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /v1/products/{product_id}/audience-configs:
    get:
      operationId: listAudienceConfigs
      summary: List the audience configurations of a product
      description: >-
        Returns the audience configurations in force of the product: for whom
        it documents its APIs, in which environments, and where each audience
        enters the documentation. Whoever may read the product may read them:
        a platform administrator, and whoever holds something in force in it,
        a role in the product or a membership in one of its workspaces. To
        anyone else there is no such product (404 PRODUCT_NOT_FOUND), the
        same as for a product that is missing. A product starts with none: it
        documents its APIs for nobody until an owner configures an audience.
        A configuration that was removed is in no list.
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageToken'
      responses:
        '200':
          description: A page of the audience configurations in force
          headers:
            Cache-Control:
              description: A product is private to its members
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudienceConfigList'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: configureAudience
      summary: Make a product document its APIs for an audience in an environment
      description: >-
        Makes the product document its APIs for the audience in the
        environment, from now until the configuration is removed, and says
        where the audience enters the documentation, if anywhere yet. Only an
        owner of the product may: its portal is the owner's to configure.
        Whoever else may know the product exists is refused (403 FORBIDDEN):
        a member of one of its workspaces, and a platform administrator, who
        registers a product and configures none of its audiences. To anyone
        else there is no such product (404 PRODUCT_NOT_FOUND), the same as
        for a product that is missing. A product documents its APIs for an
        audience in an environment once at a time: a pair that is configured
        already is refused (409 AUDIENCE_CONFIG_EXISTS), and so is a product
        that is suspended (409 PRODUCT_NOT_ACTIVE).


        The configuration, the audit record and the event are committed
        together or not at all. A 503 OUTCOME_UNCERTAIN means it is not known
        which: read before retrying.
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
