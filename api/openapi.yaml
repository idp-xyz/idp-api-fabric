  /v1/products/{product_id}/assets/{api_asset_id}/releases/{release_id}/provenance:
    get:
      operationId: getContractReleaseProvenance
      summary: Read where a release came from
      description: >-
        The release, its revision with where the source of the revision came
        from, the check the approval rests on and the approval itself, read at
        once. It says what the release was prepared on: the review and the
        check named when it was prepared, whatever has been recorded of the
        revision since. The revision may be reviewed again and approved anew,
        and a release prepared before keeps the approval and the check it was
        prepared on. It does not say whether the approval holds now: that is
        for the slot to say, in approval_problem, which getPublicationSlot
        gives and so does each item of listPublicationSlots and
        listAssetPublications. Whoever may read the release may read this, in
        the same way.

        A Git origin is what the submitter of the revision declared when it
        was imported. Fabric does not read the repository, so the commit is
        evidence of what was said and not proof of what the commit holds.
        When the same files are imported again from a later commit, the
        revision recorded first is the one that is answered, so the commit
        stays the first one that was recorded. The entrypoint is the path of
        the file inside the bundle of files that was submitted.
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/CheckAssetId'
        - $ref: '#/components/parameters/ContractReleaseId'
      responses:
        '200':
          description: What the release was prepared on
