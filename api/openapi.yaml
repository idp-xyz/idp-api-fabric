            Cache-Control:
              required: true
              schema:
                type: string
                enum: [no-store]
            X-Artifact-Digest:
              description: SHA-256 of the response bytes, formatted as sha256 followed by a colon and lowercase hex.
              required: true
              schema:
                $ref: '#/components/schemas/ContractDigest'
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
