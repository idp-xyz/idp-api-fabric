          required: true
          schema:
            $ref: '#/components/schemas/Identifier'
        - name: revision_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Identifier'
      responses:
        '200':
          description: The files of the revision, checked against its digests
