  /v1/products/{product_id}/assets/{api_asset_id}/revisions/{revision_id}/reviews/{review_id}/withdrawal:
    parameters:
      - $ref: '#/components/parameters/ProductId'
      - $ref: '#/components/parameters/CheckAssetId'
