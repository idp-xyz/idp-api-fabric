name: Fabric CI

# Runs what a developer runs: make db-up, then make check. PostgreSQL comes
# from compose.yaml rather than from a service container, so its image and its
# two roles are defined in one place for the host and for CI.
#
# It runs on every push so that a fork shows the result before a pull request
# is opened. pull_request covers the branches of forks, which push nothing to
# this repository.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: fabric-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # With CI set, the PostgreSQL tests fail when the DSNs are missing
      # instead of being skipped.
      CI: "true"
      # The two roles of compose.yaml, as make db-up prints them. They are the
      # fixed credentials of a throwaway database, not secrets.
      IDP_FABRIC_MIGRATOR_DSN: postgres://fabric:fabric@127.0.0.1:55450/postgres?sslmode=disable
      IDP_FABRIC_POSTGRES_DSN: postgres://fabric_app:fabric_app@127.0.0.1:55450/postgres?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # GOTOOLCHAIN is deliberately not set for the job. setup-go installs the
      # toolchain line of go.mod only while the variable is not already
      # "local"; with it set, the action falls back to the go line, an older
      # release. It sets the variable itself for the steps that follow, so the
      # go command cannot fetch another toolchain behind it.
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      # A run that passed on another toolchain than the one go.mod declares
      # would prove less than it appears to.
      - name: Record the toolchain
        run: |
          go version
          declared="$(go mod edit -json | jq -r '.Toolchain // ("go" + .Go)')"
          if [ "$(go env GOVERSION)" != "$declared" ] || [ "$(go env GOTOOLCHAIN)" != local ]; then
            echo "::error::CI runs $(go env GOVERSION) with GOTOOLCHAIN=$(go env GOTOOLCHAIN); go.mod declares $declared"
            exit 1
          fi

      - name: Start PostgreSQL
        run: make db-up

      - name: Check
        run: make check

      - name: PostgreSQL log
        if: failure()
        run: docker compose logs --no-color postgres
