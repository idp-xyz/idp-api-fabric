<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>契约评审 · IDP API Fabric</title>
  <link rel="stylesheet" href="/app.css">
  <script defer src="/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">跳到评审工作台</a>
  <header class="header">
    <div class="identity">
      <span class="mark" aria-hidden="true">F</span>
      <div><strong>IDP API Fabric</strong><span>Engineering Portal</span></div>
    </div>
    <span class="account" id="account"></span>
  </header>
  <main id="main">
    <div class="masthead">
      <div>
        <h1>契约评审</h1>
        <p id="context" class="muted" aria-live="polite"></p>
      </div>
      <button id="refresh" type="button" hidden>刷新队列</button>
    </div>
    <p class="message" id="notice" role="status" hidden></p>
    <div id="workbench" hidden>
      <section class="scope" aria-label="评审范围">
        <div class="field"><label for="product">产品</label><select id="product"></select></div>
        <div class="field"><label for="workspace">Workspace</label><select id="workspace"></select></div>
        <div class="field"><label for="filter">评审状态</label>
          <select id="filter">
            <option value="IN_REVIEW">待评审</option>
            <option value="">全部</option>
            <option value="APPROVED">已批准</option>
            <option value="REJECTED">已驳回</option>
            <option value="WITHDRAWN">已撤回</option>
          </select>
        </div>
      </section>
      <details id="submission" class="panel" hidden>
        <summary>提交修订评审</summary>
        <form id="request-form" class="form">
          <div class="form-grid">
            <div class="field"><label for="asset">API 资产</label><select id="asset" required></select></div>
            <div class="field"><label for="revision">修订</label><select id="revision" required></select></div>
            <div class="field"><label for="check">检查证据</label><select id="check" required></select></div>
            <div class="field"><label for="target">审批范围（可多选）</label><select id="target" multiple size="3" required></select></div>
          </div>
          <label>说明 <input id="note" maxlength="500" autocomplete="off"></label>
          <button id="request" class="primary" type="submit" disabled>提交评审</button>
        </form>
      </details>
      <div class="columns">
        <section class="panel" aria-labelledby="queue-title">
          <div class="panel-title"><h2 id="queue-title">评审队列</h2></div>
          <p id="queue-status" class="panel-body muted" role="status"></p>
          <ul id="queue" class="queue"></ul>
          <button id="more" class="more" type="button" hidden>加载更多</button>
        </section>
        <section class="panel" id="detail" aria-labelledby="detail-title" hidden>
          <div class="panel-title"><h2 id="detail-title" tabindex="-1">评审详情</h2></div>
          <div id="evidence" class="panel-body" aria-live="polite"></div>
        </section>
      </div>
    </div>
  </main>
</body>
</html>
