<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>契约检查与内部发布 · IDP API Fabric</title>
  <link rel="stylesheet" href="/app.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">跳到工程工作台</a>
  <div class="shell">
    <div class="drawer-shade" id="shade" hidden></div>
    <aside class="sidebar" id="sidebar" aria-label="工程门户导航">
      <div class="brand">
        <span class="brand-glyph" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 3.5 7.5 12 12l8.5-4.5L12 3Z"/><path d="m3.5 12 8.5 4.5 8.5-4.5"/><path d="m3.5 16.5 8.5 4.5 8.5-4.5"/></svg>
        </span>
        <div><strong>IDP API Fabric</strong><small>Engineering Portal</small></div>
      </div>
      <nav class="nav" aria-label="门户视图">
        <div id="nav-workspace" class="nav-group" hidden>
          <p class="nav-label" aria-hidden="true">Workspace</p>
          <ul>
            <li><button type="button" class="nav-item" id="nav-dashboard">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="8" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="5" rx="1.5"/><rect x="13.5" y="11.5" width="7" height="9" rx="1.5"/><rect x="3.5" y="14.5" width="7" height="6" rx="1.5"/></svg>
              <span>工作台</span>
            </button></li>
            <li><button type="button" class="nav-item" id="nav-catalog">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 3.5 7.5 12 12l8.5-4.5L12 3Z"/><path d="M3.5 7.5v9L12 21l8.5-4.5v-9"/><path d="M12 12v9"/></svg>
              <span>API 目录</span>
            </button></li>
          </ul>
        </div>
        <div id="nav-product" class="nav-group" hidden>
          <p class="nav-label" aria-hidden="true">产品</p>
          <ul>
            <li><button type="button" class="nav-item" id="nav-security">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 19 6v5.5c0 4.3-2.9 8-7 9.5-4.1-1.5-7-5.2-7-9.5V6l7-3Z"/><path d="m9 12 2 2 4-4"/></svg>
              <span>发布访问控制</span>
            </button></li>
          </ul>
        </div>
      </nav>
      <div class="sidebar-foot" id="sidebar-foot" hidden>
        <span class="foot-label">当前身份</span>
        <strong id="account-foot"></strong>
        <span id="scope-foot"></span>
      </div>
    </aside>
    <div class="main-area" id="main-area">
      <header class="topbar">
        <button type="button" class="menu-button" id="menu" aria-controls="sidebar" aria-expanded="false" aria-label="打开导航">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h16"/></svg>
        </button>
        <nav class="breadcrumb" aria-label="当前位置">
          <ol>
            <li>IDP</li>
            <li>API Fabric</li>
            <li id="crumb-view" aria-current="page">契约检查与发布</li>
            <li id="crumb-detail" hidden></li>
          </ol>
        </nav>
        <div class="scope" id="scope" hidden>
          <div class="top-field"><label for="product">产品</label><select id="product"></select></div>
          <div id="workspace-field" class="top-field" hidden><label for="workspace">Workspace</label><select id="workspace"></select></div>
        </div>
        <span class="account-chip" id="account-chip" hidden>
          <span class="avatar" id="avatar" aria-hidden="true"></span>
          <span class="account-name" id="account"></span>
        </span>
      </header>
      <main id="main" class="page" tabindex="-1">
        <div class="page-head">
          <p class="eyebrow" id="eyebrow"></p>
          <h1 id="workbench-title">契约检查与发布</h1>
          <p class="description" id="subtitle" hidden></p>
          <p id="context" class="page-status" aria-live="polite"></p>
        </div>
        <p class="notice" id="notice" role="status" hidden></p>
        <div id="workbench" hidden>
          <div id="dashboard-view" hidden></div>
          <div id="catalog-view" hidden></div>
          <div id="security-view" hidden></div>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
