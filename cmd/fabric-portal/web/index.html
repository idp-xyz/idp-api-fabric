<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>契约检查与内部发布 · IDP API Fabric</title>
  <link rel="stylesheet" href="/app.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">跳到工程工作台</a>
  <header class="header">
    <div class="identity">
      <span class="mark" aria-hidden="true">F</span>
      <div><strong>IDP API Fabric</strong><span>Engineering Portal</span></div>
    </div>
    <span class="account" id="account"></span>
  </header>
  <main id="main">
    <div class="masthead">
      <div>
        <h1 id="workbench-title">契约检查与发布</h1>
        <p id="context" class="muted" aria-live="polite"></p>
      </div>
    </div>
    <p class="message" id="notice" role="status" hidden></p>
    <div id="workbench" hidden>
      <section class="scope" aria-label="工作范围">
        <div class="field"><label for="product">产品</label><select id="product"></select></div>
        <div id="workspace-field" class="field" hidden><label for="workspace">Workspace</label><select id="workspace"></select></div>
      </section>
      <div id="security-controls" hidden></div>
      <div id="views" class="views" role="group" aria-label="工作台视图" hidden>
        <button id="view-dashboard" type="button" aria-pressed="true">工作台</button>
        <button id="view-catalog" type="button" aria-pressed="false">API 目录</button>
      </div>
      <div id="dashboard-view" hidden></div>
      <div id="catalog-view" hidden></div>
    </div>
  </main>
</body>
</html>
